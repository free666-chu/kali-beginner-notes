function lessonTrail(l){
  const tids = (TRAIL[l.mod.id]||[]).filter(id=>topicById(id));
  const pids = (PROJ_TRAIL[l.mod.id]||[]).map(id=>MASTER.projects.find(p=>p.id===id)).filter(Boolean);
  if(!tids.length && !pids.length) return '';
  let h = `<div class="trail"><b class="h">⬆️ 再深一层：这节对应的源码级专题</b>`;
  tids.forEach(id=>{
    const t = topicById(id);
    h += `<div class="titem" data-topic="${t.id}"><span>${t.ic}</span><span><span class="ttl">${esc(t.title)}</span><small>${esc(t.cat)} · ${esc(t.lv)} · ${esc(t.time)}</small></span></div>`;
  });
  if(pids.length){
    h += `<b class="h" style="margin-top:10px">🏗 练完可以做的大师项目</b>`;
    pids.forEach(p=>{
      h += `<div class="titem" data-proj="${p.id}"><span>${p.ic}</span><span><span class="ttl">${esc(p.title)}</span><small>${esc(p.lv)} · ${esc(p.time)}</small></span></div>`;
    });
  }
  h += `</div>`;
  return h;
}

/* ============ router ============ */
function currentLessonId(){
  const h = location.hash.replace(/^#\/?/, '');
  return h.startsWith('lesson/') ? decodeURIComponent(h.slice(7)) : null;
}
function isLabsRoute(){
  return location.hash.replace(/^#\/?/, '') === 'labs';
}
function isMasterRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  return h === 'master' || h.startsWith('master/');
}
function masterFocus(){
  const h = location.hash.replace(/^#\/?/, '');
  return h.startsWith('master/') ? decodeURIComponent(h.split('/')[1]) : null;
}
function render(){
  const id = currentLessonId();
  if(isLabsRoute()) renderLabs();
  else if(isMasterRoute()) renderMaster(masterFocus());
  else if(id) renderLesson(id); else renderHome();
  renderNav();
  window.scrollTo(0,0);
  $('#sidebar').classList.remove('open');
}
window.addEventListener('hashchange', render);

/* ============ interactions ============ */
document.addEventListener('click', e=>{
  const ms = e.target.closest('[data-master]');
  if(ms){ location.hash = '#/master'; return; }
  const tp = e.target.closest('[data-topic]');
  if(tp){ location.hash = '#/master/' + tp.getAttribute('data-topic'); return; }
  const pj = e.target.closest('[data-proj]');
  if(pj){ location.hash = '#/master/' + pj.getAttribute('data-proj'); return; }
  const lb = e.target.closest('[data-labs]');
  if(lb){ location.hash = '#/labs'; return; }
  const chip = e.target.closest('[data-chip]');
  if(chip){ labCat = chip.getAttribute('data-chip'); renderLabs(); window.scrollTo(0,240); return; }
  const cl = e.target.closest('[data-copy-lab]');
  if(cl){
    const lab = LABS[+cl.getAttribute('data-copy-lab')];
    copyText(lab.run).then(()=>toast('部署命令已复制')).catch(()=>toast('复制失败，手动选中吧'));
    return;
  }
  const dl = e.target.closest('[data-dl-labs]');
  if(dl){ downloadScript(); return; }
  const cs = e.target.closest('[data-copy-script]');
  if(cs){ copyText(buildScript()).then(()=>toast('脚本已复制')).catch(()=>toast('复制失败')); return; }
  const nav = e.target.closest('[data-go]');
  if(nav){
    const id = nav.getAttribute('data-go');
    location.hash = id ? '#/lesson/' + encodeURIComponent(id) : '';
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const k = cp.getAttribute('data-copy');
    const [lid, i] = k.split('#');
    const s = findLesson(lid).steps[+i];
    copyText(s.cmd).then(()=>toast('已复制，去 Kali 里粘贴吧')).catch(()=>toast('复制失败，手动选中吧'));
    return;
  }
  const hb = e.target.closest('[data-hint]');
  if(hb){
    const k = hb.getAttribute('data-hint');
    const [lid,i] = k.split('#');
    const hints = findLesson(lid).steps[+i].hints || [];
    let lv = +(hb.getAttribute('data-lv'));
    if(lv < hints.length){
      const box = document.querySelector(`[data-hl="${k}"]`);
      const div = document.createElement('div');
      div.className = 'hint';
      div.textContent = `提示 ${lv+1}：` + hints[lv];
      box.appendChild(div);
      lv++;
      hb.setAttribute('data-lv', lv);
      hb.textContent = lv >= hints.length ? '💡 提示已全部给出' : `💡 再看一条（${lv+1}/${hints.length}）`;
      if(lv >= hints.length){ hb.disabled = true; hb.style.opacity = .65; hb.style.cursor='default'; }
    }
    return;
  }
  const tb = e.target.closest('[data-try]');
  if(tb){ doTry(tb.getAttribute('data-try')); return; }

  const ob = e.target.closest('[data-opt]');
  if(ob && !ob.disabled){
    const box = ob.closest('.quiz');
    const lid = box.getAttribute('data-q');
    const l = findLesson(lid);
    const pick = +ob.getAttribute('data-opt');
    box.querySelectorAll('.opt').forEach((b,i)=>{
      b.disabled = true; b.style.cursor = 'default';
      if(i === l.quiz.a) b.classList.add('right');
      else if(i === pick) b.classList.add('wrong');
    });
    box.querySelector('.qexp').classList.add('show');
    if(pick === l.quiz.a){ state.quiz[lid] = true; saveState(); toast('答对了 ✓'); }
    else toast('再想想：正确答案已标绿，读完解释继续');
    return;
  }

  const mb = e.target.closest('#btn-menu');
  if(mb){ $('#sidebar').classList.toggle('open'); return; }
});

document.addEventListener('change', e=>{
  const tk = e.target.closest('[data-task]');
  if(tk){
    const kk = tk.getAttribute('data-task');
    if(tk.checked) state.tasks[kk] = true; else delete state.tasks[kk];
    saveState();
    const row = tk.closest('.task');
    if(row) row.classList.toggle('done', tk.checked);
    return;
  }
  const cb = e.target.closest('[data-check]');
  if(!cb) return;
  const k = cb.getAttribute('data-check');
  const [lid,i] = k.split('#');
  if(cb.checked) state.steps[k] = true; else delete state.steps[k];
  saveState();
  const card = cb.closest('.step');
  card.classList.toggle('done', cb.checked);
  const l = findLesson(lid);
  const pct = lessonPct(l);
  const tag = $('#lpct'); if(tag) tag.textContent = '进度 ' + pct + '%';
  renderNav();
  if(lessonDone(l)) toast('这一节全部步骤完成 🎉');
});

function doTry(k){
  const s = findLesson(k.split('#')[0]).steps[+k.split('#')[1]];
  const cfg = s.try || {};
  const wrap = document.querySelector(`.try[data-k="${k}"]`);
  if(!wrap) return;
  const val = (wrap.querySelector('input').value || '').trim().toLowerCase();
  const msg = wrap.querySelector('[data-msg]');
  msg.classList.add('show');
  if(!val){
    msg.className = 'trymsg show bad'; msg.textContent = '先写点什么——哪怕只写工具名，也是思考的开始。';
    return;
  }
  const need = cfg.need || [];
  const ok = need.every(n => val.includes(String(n).toLowerCase()));
  if(ok){
    msg.className = 'trymsg show good';
    msg.textContent = '✓ ' + (cfg.ok || '对了。这条命令你已经会自己写出来了。');
    const cb = document.querySelector(`[data-check="${k}"]`);
    if(cb && !cb.checked){ cb.checked = true; cb.dispatchEvent(new Event('change', {bubbles:true})); }
  }else{
    msg.className = 'trymsg show bad';
    msg.textContent = '再试一下：' + (cfg.hint || '检查一下工具名、参数、目标地址是否齐全。');
  }
}
document.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && e.target.matches('.tryrow input')){
    const k = e.target.closest('.try').getAttribute('data-k');
    doTry(k);
  }
});

function copyText(text){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((res, rej)=>{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); res(); }catch(err){ rej(err); }
    document.body.removeChild(ta);
  });
}

/* ============ search ============ */
const qEl = $('#q'), resEl = $('#results');
qEl.addEventListener('input', ()=>{
  const v = qEl.value.trim().toLowerCase();
  if(!v){ resEl.classList.remove('show'); return; }
  const hits = [];
  allLessons().forEach(l=>{
    const hay = [l.title, l.mod.name, (l.tags||[]).join(' '), l.goal.join(' '), JSON.stringify(l.steps)].join(' ').toLowerCase();
    if(hay.includes(v)){
      let sub = '';
      l.steps.forEach(s=>{ if(!sub && ((s.cmd||'')+' '+s.title).toLowerCase().includes(v)) sub = (s.cmd||'').split('\n')[0].slice(0,52) || s.title; });
      hits.push({l, sub});
    }
  });
  resEl.innerHTML = hits.length
    ? hits.slice(0,12).map(h=>`<div class="res-item" data-go="${h.l.id}">${esc(h.l.title)}<small>第 ${h.l.mod.no} 章 · ${esc(h.l.mod.short||h.l.mod.name)}${h.sub?' · '+esc(h.sub):''}</small></div>`).join('')
    : '<div class="res-empty">没找到。试试工具名（nmap、burp、hashcat）或方向名（Web、取证、提权）。</div>';
  resEl.classList.add('show');
});
qEl.addEventListener('focus', ()=>{ if(qEl.value.trim()) resEl.classList.add('show'); });
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) resEl.classList.remove('show'); });
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
});
resEl.addEventListener('click', ()=>{ resEl.classList.remove('show'); qEl.value=''; });

/* ============ reset ============ */
$('#btn-reset').addEventListener('click', ()=>{
  if(confirm('确定清空所有学习进度吗？这个操作不能撤销。')){
    state = {steps:{}, quiz:{}, tasks:{}, last:null}; saveState(); render(); toast('进度已重置');
  }
});

/* ============ init ============ */
if(!location.hash && state.last) location.hash = '#/lesson/' + encodeURIComponent(state.last);
render();
</script>
